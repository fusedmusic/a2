<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Habla Español — DELE A2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0B09;font-family:'Palatino Linotype',Palatino,serif;color:#EDE8DF;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.screen{min-height:100vh}
.btn{cursor:pointer;font-family:inherit;border:none;transition:opacity 0.2s}
.btn:active{opacity:0.7}
input,textarea{font-family:inherit;outline:none}
@keyframes wave1{0%,100%{height:4px}50%{height:22px}}
@keyframes wave2{0%,100%{height:6px}50%{height:18px}}
@keyframes wave3{0%,100%{height:8px}50%{height:26px}}

@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein 0.3s ease forwards}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#2A2825}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── Data ───────────────────────────────────────────────────────────────────
const WEEKS = [
  {week:1,title:"Consolidating the Present",color:"#C0392B",lessons:[
    {id:"1-1",day:1,title:"Ser vs Estar — the real rules",grammar:"Ser/estar with adjectives that change meaning",focus:"permanence vs state, emotion, location"},
    {id:"1-2",day:2,title:"Reflexive verbs in context",grammar:"Reflexive + daily routine verbs",focus:"levantarse, ponerse, quedarse, llevarse bien"},
    {id:"1-3",day:3,title:"Gustar & verbs like it",grammar:"Indirect object pronouns + gustar/doler/parecer/encantar",focus:"me/te/le/nos/os/les"},
    {id:"1-4",day:4,title:"Expressing obligation & ability",grammar:"Tener que / hay que / poder / deber",focus:"modal constructions at A2"},
    {id:"1-5",day:5,title:"Quantifiers & intensifiers",grammar:"Muy, mucho, bastante, demasiado, poco, nada",focus:"agreement and placement"},
    {id:"1-6",day:6,title:"Question forms deep dive",grammar:"All interrogative pronouns in complex sentences",focus:"qué vs cuál, por qué vs para qué"},
    {id:"1-7",day:7,title:"Week 1 Voice Mock",grammar:"Oral production — present tense",focus:"DELE A2 speaking task simulation"},
  ]},
  {week:2,title:"Mastering the Past",color:"#D35400",lessons:[
    {id:"2-1",day:8,title:"Pretérito Indefinido — irregulars",grammar:"Irregular stems: andar, poner, saber, querer, venir",focus:"fui/vine/tuve/hice/dije patterns"},
    {id:"2-2",day:9,title:"Pretérito Imperfecto",grammar:"Imperfecto formation + key uses",focus:"describing past states, habitual past"},
    {id:"2-3",day:10,title:"Indefinido vs Imperfecto",grammar:"Contrast: completed action vs background",focus:"narrative past — the critical A2 distinction"},
    {id:"2-4",day:11,title:"Time expressions that signal tense",grammar:"Ayer/anoche vs siempre/antes/cuando era niño",focus:"temporal markers as tense cues"},
    {id:"2-5",day:12,title:"Talking about past experiences",grammar:"Ya/todavía no + indefinido",focus:"¿Alguna vez…? response patterns"},
    {id:"2-6",day:13,title:"Describing people & places in the past",grammar:"Imperfecto for description vs indefinido for events",focus:"narrative construction"},
    {id:"2-7",day:14,title:"Week 2 Voice Mock",grammar:"Oral production — past tenses",focus:"DELE A2 narrating a past event"},
  ]},
  {week:3,title:"Future, Opinions & Discourse",color:"#1A7A4A",lessons:[
    {id:"3-1",day:15,title:"Future tense — regular & irregular",grammar:"Futuro simple: formation + irregulars",focus:"predictions vs plans"},
    {id:"3-2",day:16,title:"Condicional introduction",grammar:"Condicional simple for polite requests",focus:"gustaría, podría, debería"},
    {id:"3-3",day:17,title:"Expressing opinions confidently",grammar:"Creo que / me parece que / en mi opinión",focus:"agreement, disagreement, hedging"},
    {id:"3-4",day:18,title:"Connectors & discourse markers",grammar:"Addition, contrast, consequence connectors",focus:"además, sin embargo, por eso, aunque"},
    {id:"3-5",day:19,title:"Making comparisons",grammar:"Más/menos que, tan…como, superlatives",focus:"comparative sentences in speech"},
    {id:"3-6",day:20,title:"Likes, dislikes & preferences",grammar:"Preferir, odiar, soportar + infinitive/noun",focus:"nuanced opinion vocabulary"},
    {id:"3-7",day:21,title:"Week 3 Voice Mock",grammar:"Oral production — opinions & future",focus:"DELE A2 giving and defending a view"},
  ]},
  {week:4,title:"DELE A2 Exam Technique",color:"#2471A3",lessons:[
    {id:"4-1",day:22,title:"Reading: extract key information",grammar:"Scanning, skimming, inference at A2",focus:"DELE Comprensión de Lectura task types"},
    {id:"4-2",day:23,title:"Listening: real-pace dialogues",grammar:"Listening for gist + specific detail",focus:"DELE Comprensión Auditiva strategies"},
    {id:"4-3",day:24,title:"Writing: structured short texts",grammar:"Email/message register, cohesion",focus:"DELE Expresión Escrita — 50-80 word tasks"},
    {id:"4-4",day:25,title:"Speaking task 1 — describe & react",grammar:"Valuation of images/situations",focus:"DELE Expresión Oral Part 1"},
    {id:"4-5",day:26,title:"Speaking task 2 — role play",grammar:"Transactional language: asking, clarifying",focus:"DELE Expresión Oral Part 2"},
    {id:"4-6",day:27,title:"Full timed mock — Written",grammar:"All written DELE A2 task types",focus:"Comprensión + Escritura"},
    {id:"4-7",day:28,title:"🎓 Full mock — Oral + Review",grammar:"Oral mock + personalised feedback",focus:"DELE Expresión Oral full simulation"},
  ]},
];

// ─── State ──────────────────────────────────────────────────────────────────
const state = {
  screen: 'home',
  activeWeek: 0,
  lesson: null,
  mode: null,
  progress: JSON.parse(localStorage.getItem('a2_prog')||'{}'),
  xp: parseInt(localStorage.getItem('a2_xp')||'0'),
  exercise: null,
  chatHistory: [],
  feedback: null,
  loading: false,
};

function saveProgress(id) {
  state.progress[id] = true;
  localStorage.setItem('a2_prog', JSON.stringify(state.progress));
  state.xp += 60;
  localStorage.setItem('a2_xp', state.xp);
}

function go(screen, extra={}) {
  Object.assign(state, {screen, exercise:null, feedback:null, loading:false, chatHistory:[], ...extra});
  render();
}

// ─── TTS ────────────────────────────────────────────────────────────────────
const VOICE_PREFS = [
  v=>v.name==='Google español'&&v.lang==='es-ES',
  v=>v.name.includes('Google')&&v.lang.startsWith('es'),
  v=>v.name==='Mónica'&&v.lang==='es-ES',
  v=>v.name.includes('Monica')&&v.lang.startsWith('es'),
  v=>v.name.includes('Paulina')&&v.lang.startsWith('es'),
  v=>v.name.includes('Microsoft')&&v.lang==='es-ES',
  v=>v.name.includes('Microsoft')&&v.lang.startsWith('es'),
  v=>v.lang==='es-ES',
  v=>v.lang.startsWith('es'),
];
let _voice = null;
function getBestVoice() {
  if (_voice) return _voice;
  const voices = speechSynthesis.getVoices();
  for (const p of VOICE_PREFS) { const v=voices.find(p); if(v){_voice=v;return v;} }
  return null;
}
speechSynthesis.onvoiceschanged = ()=>{ _voice=null; getBestVoice(); };
speechSynthesis.getVoices();

function speak(text, rate=0.88) {
  speechSynthesis.cancel();
  const doIt = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang='es-ES'; u.rate=rate;
    const v=getBestVoice(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  };
  speechSynthesis.getVoices().length ? doIt() : setTimeout(doIt, 300);
}

// ─── Claude API ──────────────────────────────────────────────────────────────
async function callClaude(system, userMsg, maxTokens=800) {
  const messages = Array.isArray(userMsg) ? userMsg : [{role:'user',content:userMsg}];
  const r = await fetch('https://sparkling-frog-5ddd.mmabobmasters.workers.dev',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTokens,system,messages})
  });
  const d = await r.json();
  return d.content?.[0]?.text || '';
}

async function loadExercise(lesson, mode) {
  state.loading = true;
  state.exercise = null;
  state.feedback = null;
  state.chatHistory = [];
  render();

  const sys = 'You are a DELE A2 Spanish teacher. Return ONLY valid JSON. No markdown, no backticks.';
  let prompt = '';

  if (mode==='drill') {
    prompt = `Create 5 fill-in-the-blank sentences for low A2 Spanish. Topic: "${lesson.title}". Grammar: "${lesson.grammar}".
Return: {"type":"drill","items":[{"sentence":"Spanish with ___ gap","answer":"word","hint":"English tip","full":"complete sentence"}]}`;
  } else if (mode==='pronunciation') {
    prompt = `Create 6 Spanish phrases for A2 pronunciation practice. Topic: "${lesson.title}".
Return: {"type":"pronunciation","items":[{"es":"phrase","en":"meaning","tip":"pronunciation tip","sounds":"sounds to focus on"}]}`;
  } else if (mode==='quiz') {
    prompt = `Create 5 DELE A2 multiple choice questions. Topic: "${lesson.title}". Grammar: "${lesson.grammar}".
Return: {"type":"quiz","items":[{"q":"question","options":["A. text","B. text","C. text","D. text"],"answer":"A. text","explain":"reason"}]}`;
  } else if (mode==='conversation') {
    prompt = `Create an A2 Spanish conversation scenario. Topic: "${lesson.title}".
Return: {"type":"conversation","scenario":"1-sentence situation in English","opener":"first Spanish line from AI (A2 level, 1 sentence)","tips":["phrase 1","phrase 2","phrase 3"]}`;
  }

  try {
    const raw = await callClaude(sys, prompt);
    const clean = raw.replace(/```json|```/g,'').trim();
    const data = JSON.parse(clean);
    state.exercise = data;
    if (mode==='conversation') {
      state.chatHistory = [{role:'assistant',text:data.opener}];
      speak(data.opener);
    }
  } catch(e) {
    state.exercise = {error: 'Could not load — tap to retry.'};
  }
  state.loading = false;
  state.exerciseIdx = 0;
  render();
}

// ─── DOM helpers ─────────────────────────────────────────────────────────────
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='style' && typeof v==='object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c==null) continue;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  }
  return e;
}
const div = (a,...c)=>el('div',a,...c);
const btn = (a,...c)=>el('button',{...a,class:(a.class||'')+' btn'},...c);
const span = (a,...c)=>el('span',a,...c);
const p = (a,...c)=>el('p',a,...c);
const inp = (a)=>el('input',a);

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const s = state.screen;
  let node;
  if (s==='home') node = renderHome();
  else if (s==='map') node = renderMap();
  else if (s==='lesson') node = renderLesson();
  else if (s==='exercise') node = renderExercise();
  else node = div({}, 'Unknown screen');
  node.classList.add('fadein');
  app.appendChild(node);
}

// ─── HOME ────────────────────────────────────────────────────────────────────
function renderHome() {
  const total = WEEKS.reduce((a,w)=>a+w.lessons.length,0);
  const done = Object.keys(state.progress).length;
  const pct = Math.round(done/total*100);

  return div({style:{minHeight:'100vh',padding:'3rem 1.8rem 2rem',position:'relative',overflow:'hidden',background:'#0C0B09'}},
    div({style:{position:'absolute',top:0,left:0,right:0,height:3,background:'linear-gradient(90deg,#C0392B,#D35400,#1A7A4A,#2471A3)'}}),
    p({style:{fontSize:'0.65rem',letterSpacing:'0.2em',color:'#C0392B',textTransform:'uppercase',marginBottom:'0.8rem'}},'DELE A2 · Low A2 → Certified'),
    el('h1',{style:{fontSize:'clamp(2.8rem,11vw,4.5rem)',fontWeight:700,lineHeight:1.05,marginBottom:'1rem',fontStyle:'italic',color:'#EDE8DF'}},
      'habla ', el('br',{}), el('span',{style:{color:'#C0392B'}},'español.')),
    p({style:{fontSize:'0.9rem',color:'#999',lineHeight:1.7,maxWidth:320,marginBottom:'1.5rem'}},
      'Voice-first Spanish. 28 lessons. Real pronunciation feedback. AI conversation partner.'),
    div({style:{display:'flex',gap:'1.5rem',marginBottom:'1rem'}},
      ...[['Lessons',`${done}/${total}`],['XP',state.xp],['Progress',`${pct}%`]].map(([l,v])=>
        div({},
          div({style:{fontSize:'1.3rem',fontWeight:700,color:'#D35400'}},v),
          div({style:{fontSize:'0.6rem',color:'#666',textTransform:'uppercase',letterSpacing:'0.15em'}},l)
        )
      )
    ),
    div({style:{height:3,background:'#1A1816',borderRadius:2,marginBottom:'2rem',overflow:'hidden'}},
      div({style:{height:'100%',background:'linear-gradient(90deg,#C0392B,#D35400)',width:pct+'%',transition:'width 0.6s'}})
    ),
    div({style:{display:'flex',flexWrap:'wrap',gap:'0.5rem',marginBottom:'2rem'}},
      ...['🔊 TTS Playback','🎙 Voice Input','🗣 AI Conversation','📊 Pronunciation Score'].map(b=>
        span({style:{fontSize:'0.7rem',padding:'0.25rem 0.6rem',border:'1px solid #2A2825',borderRadius:20,color:'#AAA'}},b)
      )
    ),
    btn({style:{background:'#C0392B',color:'#fff',padding:'0.9rem 2.2rem',fontSize:'1rem',fontWeight:700,letterSpacing:'0.05em',border:'none'},
      onClick:()=>go('map')},
      done===0?'Empezamos →':'Continuar →'
    ),
    div({style:{position:'absolute',bottom:'-10%',right:'-15%',width:280,height:280,borderRadius:'50%',border:'1px solid #1A1816',pointerEvents:'none'}}),
    div({style:{position:'absolute',bottom:'8%',right:'-5%',width:140,height:140,borderRadius:'50%',background:'#0F0E0C',border:'1px solid #1A1816',pointerEvents:'none'}})
  );
}

// ─── MAP ─────────────────────────────────────────────────────────────────────
function renderMap() {
  const w = WEEKS[state.activeWeek];

  const tabRow = div({style:{display:'flex',borderBottom:'1px solid #1A1816',background:'#0C0B09'}},
    ...WEEKS.map((wk,i)=>
      btn({
        style:{flex:1,background:'none',border:'none',
          borderBottom:i===state.activeWeek?`3px solid ${wk.color}`:'3px solid transparent',
          color:i===state.activeWeek?wk.color:'#555',padding:'0.85rem 0.3rem',
          fontWeight:i===state.activeWeek?700:400,fontSize:'0.85rem'},
        onClick:()=>{ state.activeWeek=i; render(); }
      }, 'W'+wk.week)
    )
  );

  const banner = div({style:{padding:'0.9rem 1.5rem',display:'flex',alignItems:'center',gap:'0.8rem',borderBottom:'1px solid #1A1816'}},
    span({style:{fontSize:'0.65rem',color:w.color,textTransform:'uppercase',letterSpacing:'0.2em',fontWeight:700}},'Week '+w.week),
    span({style:{fontWeight:700,fontSize:'1rem',fontStyle:'italic'}},w.title)
  );

  const lessonList = div({style:{padding:'0.5rem 1.2rem 3rem'}},
    ...w.lessons.map((l,i)=>{
      const isDone = !!state.progress[l.id];
      const prevDone = i===0 ? true : !!state.progress[w.lessons[i-1].id];
      const locked = !isDone && !prevDone;
      const card = div({
        style:{display:'flex',alignItems:'center',padding:'1rem 0.9rem',margin:'0.5rem 0',
          background:'#111009',borderLeft:`4px solid ${locked?'#2A2825':w.color}`,
          cursor:locked?'default':'pointer',gap:'0.8rem',opacity:locked?0.3:1,userSelect:'none'}
        },
        span({style:{fontSize:'0.6rem',color:'#666',textTransform:'uppercase',letterSpacing:'0.1em',minWidth:30,flexShrink:0}},'D'+l.day),
        div({style:{flex:1,minWidth:0}},
          div({style:{fontSize:'0.92rem',fontWeight:700,marginBottom:2}},l.title),
          div({style:{fontSize:'0.72rem',color:'#888',fontStyle:'italic'}},l.focus)
        ),
        span({style:{fontSize:'1rem',flexShrink:0,color:isDone?'#4A9D6F':locked?'#555':w.color,fontWeight:700}},
          isDone?'✓':locked?'🔒':'→')
      );
      if (!locked) card.addEventListener('click', ()=>go('lesson',{lesson:l,mode:null}));
      return card;
    })
  );

  return div({style:{minHeight:'100vh',background:'#0C0B09'}},
    div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0.9rem 1.5rem',borderBottom:'1px solid #1A1816',background:'#0C0B09'}},
      btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.9rem',fontSize:'0.82rem'},onClick:()=>go('home')},'← Home'),
      span({style:{color:'#D35400',fontSize:'0.85rem',fontWeight:700}},'⚡ '+state.xp+' XP')
    ),
    tabRow, banner, lessonList
  );
}

// ─── LESSON ───────────────────────────────────────────────────────────────────
function renderLesson() {
  const l = state.lesson;
  const w = WEEKS.find(wk=>wk.lessons.some(x=>x.id===l.id));
  const isDone = !!state.progress[l.id];

  const modes = [
    {id:'drill',icon:'⚡',label:'Grammar Drills',desc:'Fill-blanks + voice answer'},
    {id:'pronunciation',icon:'🔊',label:'Pronunciation Lab',desc:'Hear + repeat + get scored'},
    {id:'conversation',icon:'🗣',label:'Voice Conversation',desc:'Full spoken AI dialogue'},
    {id:'quiz',icon:'🎯',label:'DELE Quiz',desc:'Exam-style questions'},
  ];

  return div({style:{minHeight:'100vh',background:'#0C0B09'}},
    div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0.9rem 1.5rem',borderBottom:'1px solid #1A1816',background:'#0C0B09'}},
      btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.9rem',fontSize:'0.82rem'},onClick:()=>go('map')},'← Map'),
      span({style:{color:'#D35400',fontSize:'0.85rem',fontWeight:700}},'⚡ '+state.xp+' XP')
    ),
    div({style:{padding:'1.5rem',background:w.color,color:'#fff'}},
      div({style:{fontSize:'0.65rem',textTransform:'uppercase',letterSpacing:'0.2em',opacity:0.75,marginBottom:'0.4rem'}},'Day '+l.day+' · Week '+w.week),
      el('h2',{style:{margin:'0 0 0.3rem',fontSize:'1.3rem',fontWeight:700}},l.title),
      div({style:{opacity:0.85,fontSize:'0.82rem',fontStyle:'italic',marginBottom:'0.8rem'}},l.grammar),
      btn({style:{background:'rgba(0,0,0,0.25)',border:'1px solid rgba(255,255,255,0.35)',color:'#fff',padding:'0.35rem 0.9rem',fontSize:'0.78rem'},
        onClick:()=>speak(l.title+'. '+l.grammar)},'🔊 Hear topic')
    ),
    div({style:{padding:'1.2rem 1.5rem'}},
      div({style:{fontSize:'0.65rem',textTransform:'uppercase',letterSpacing:'0.2em',color:'#666',marginBottom:'0.8rem'}},'Choose practice mode'),
      ...modes.map(m=>
        btn({style:{display:'flex',alignItems:'center',gap:'1rem',width:'100%',background:'#111009',
          border:'1px solid #1E1C18',padding:'0.9rem 1rem',marginBottom:'0.5rem',color:'#EDE8DF',textAlign:'left'},
          onClick:()=>{ state.mode=m.id; loadExercise(l,m.id); go('exercise'); }},
          span({style:{fontSize:'1.4rem',width:32,textAlign:'center',flexShrink:0}},m.icon),
          div({},
            div({style:{fontWeight:700,fontSize:'0.9rem',marginBottom:2}},m.label),
            div({style:{fontSize:'0.75rem',color:'#888'}},m.desc)
          )
        )
      ),
      !isDone && btn({style:{width:'100%',marginTop:'0.8rem',border:'1px solid #4A9D6F',background:'none',color:'#4A9D6F',padding:'0.7rem',fontSize:'0.85rem'},
        onClick:()=>{ saveProgress(l.id); go('map'); }},'Mark complete (+60 XP) ✓'),
      isDone && div({style:{marginTop:'0.8rem',color:'#4A9D6F',fontSize:'0.85rem',textAlign:'center'}},'✅ Complete — keep practising!')
    )
  );
}

// ─── EXERCISE ─────────────────────────────────────────────────────────────────
function renderExercise() {
  const l = state.lesson;
  const w = WEEKS.find(wk=>wk.lessons.some(x=>x.id===l.id));

  const header = div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0.9rem 1.5rem',borderBottom:'1px solid #1A1816',background:'#0C0B09'}},
    btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.9rem',fontSize:'0.82rem'},
      onClick:()=>go('lesson',{lesson:l,mode:null})},'← Back'),
    span({style:{color:w.color,fontSize:'0.8rem'}}, {drill:'⚡ Drills',pronunciation:'🔊 Pronunciation',conversation:'🗣 Conversation',quiz:'🎯 Quiz'}[state.mode])
  );

  if (state.loading) {
    return div({style:{minHeight:'100vh',background:'#0C0B09'}}, header,
      div({style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'4rem 2rem',gap:'1rem'}},
        div({style:{width:32,height:32,border:`3px solid ${w.color}`,borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}),
        div({style:{color:'#888',fontSize:'0.9rem'}},'Generating exercise…'),
        div({style:{color:'#555',fontSize:'0.75rem'}},'This takes a few seconds')
      )
    );
  }

  if (!state.exercise || state.exercise.error) {
    return div({style:{minHeight:'100vh',background:'#0C0B09'}}, header,
      div({style:{padding:'2rem 1.5rem',textAlign:'center'}},
        div({style:{color:'#C0392B',marginBottom:'1rem'}},state.exercise?.error||'Something went wrong.'),
        btn({style:{background:w.color,color:'#fff',padding:'0.7rem 1.5rem',border:'none',fontSize:'0.9rem'},
          onClick:()=>loadExercise(l,state.mode)},'Retry')
      )
    );
  }

  let content;
  if (state.mode==='drill') content = renderDrill(w);
  else if (state.mode==='pronunciation') content = renderPronunciation(w);
  else if (state.mode==='quiz') content = renderQuiz(w);
  else if (state.mode==='conversation') content = renderConversation(w);
  else content = div({},'Unknown mode');

  return div({style:{minHeight:'100vh',background:'#0C0B09'}}, header, content);
}

// ─── DRILL ────────────────────────────────────────────────────────────────────
function renderDrill(w) {
  const items = state.exercise.items || [];
  const idx = state.exerciseIdx || 0;
  const item = items[idx];
  if (!item) return div({style:{padding:'2rem',textAlign:'center',color:'#4A9D6F'}},'🎉 All drills done!');

  const parts = item.sentence.split('___');
  let currentAnswer = '';

  const answerDisplay = div({style:{borderBottom:`2px solid ${w.color}`,minWidth:80,display:'inline-block',textAlign:'center',color:w.color,margin:'0 6px',fontSize:'1.05rem',minHeight:'1.4em'}});

  const textInput = el('input',{
    type:'text',placeholder:'Type answer…',
    style:{flex:1,background:'#111009',border:'1px solid #2A2825',color:'#EDE8DF',padding:'0.65rem 0.8rem',fontSize:'0.9rem',borderRadius:2}
  });
  textInput.addEventListener('input',e=>{ currentAnswer=e.target.value; answerDisplay.textContent=e.target.value||'___'; });

  const feedbackBox = div({style:{margin:'0.8rem 0',padding:'0.9rem',background:'#111009',border:'1px solid #1E1C18',fontSize:'0.85rem',lineHeight:1.6,display:'none'}});

  const checkBtn = btn({style:{width:'100%',background:w.color,color:'#fff',padding:'0.75rem',fontSize:'0.9rem',fontWeight:700,border:'none',marginTop:'0.5rem'}},
    'Check Answer');

  checkBtn.addEventListener('click', async ()=>{
    if (!currentAnswer.trim()) return;
    checkBtn.textContent = 'Checking…';
    checkBtn.disabled = true;
    const fb = await callClaude(
      'You are a kind DELE A2 Spanish teacher. 2 sentences max. Start ✅ if correct or ❌ if wrong.',
      `Student answered "${currentAnswer}" for blank in "${item.sentence}". Correct: "${item.answer}". Give feedback.`
    );
    feedbackBox.textContent = fb + ' ✔ Correct: ' + item.answer;
    feedbackBox.style.display = 'block';
    speak(item.full || item.answer);
    checkBtn.textContent = 'Check Answer';
    checkBtn.disabled = false;
  });

  // Mic button
  const micBtn = btn({style:{width:42,height:42,borderRadius:'50%',border:`2px solid ${w.color}`,background:'transparent',fontSize:'1.1rem',flexShrink:0}},'🎙');
  micBtn.addEventListener('click',()=>{
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition needs Chrome.'); return; }
    const rec = new SR(); rec.lang='es-ES'; rec.continuous=false; rec.interimResults=false;
    rec.onresult = e => { const t=e.results[0][0].transcript; textInput.value=t; currentAnswer=t; answerDisplay.textContent=t; };
    rec.start();
    micBtn.textContent='⏹'; micBtn.style.background=w.color;
    rec.onend=()=>{ micBtn.textContent='🎙'; micBtn.style.background='transparent'; };
  });

  const navRow = div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'0.8rem'}});
  if (idx > 0) {
    const prevBtn = btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.8rem',fontSize:'0.8rem'},'onClick':()=>{ state.exerciseIdx=idx-1; state.feedback=null; render(); }},'← Prev');
    navRow.appendChild(prevBtn);
  } else navRow.appendChild(div({}));
  navRow.appendChild(span({style:{color:'#666',fontSize:'0.75rem'}},(idx+1)+' / '+items.length));
  if (idx < items.length-1) {
    const nextBtn = btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.8rem',fontSize:'0.8rem'},'onClick':()=>{ state.exerciseIdx=idx+1; state.feedback=null; render(); }},'Next →');
    navRow.appendChild(nextBtn);
  } else navRow.appendChild(div({}));

  return div({style:{padding:'1rem 1.2rem 2rem'}},
    div({style:{color:'#666',fontSize:'0.72rem',textAlign:'right',marginBottom:'0.4rem'}},(idx+1)+' / '+items.length),
    div({style:{background:'#111009',border:'1px solid #1E1C18',padding:'1.2rem',marginBottom:'1rem'}},
      div({style:{fontSize:'0.78rem',color:'#888',fontStyle:'italic',marginBottom:'0.8rem'}},'💡 '+item.hint),
      div({style:{fontSize:'1.05rem',lineHeight:2.2}},
        document.createTextNode(parts[0]||''),
        answerDisplay,
        document.createTextNode(parts[1]||'')
      ),
      btn({style:{background:'none',border:'none',color:'#888',fontSize:'0.78rem',marginTop:'0.5rem',cursor:'pointer'},
        onClick:()=>speak(item.full||item.answer)},'🔊 Hear full sentence')
    ),
    div({style:{display:'flex',gap:'0.6rem',alignItems:'center',marginBottom:'0.5rem'}},
      textInput, micBtn
    ),
    checkBtn,
    feedbackBox,
    navRow
  );
}

// ─── PRONUNCIATION ────────────────────────────────────────────────────────────
function renderPronunciation(w) {
  const items = state.exercise.items || [];
  const idx = state.exerciseIdx || 0;
  const item = items[idx];
  if (!item) return div({style:{padding:'2rem',textAlign:'center',color:'#4A9D6F'}},'🎉 All phrases done!');

  const spokenDisplay = div({style:{fontSize:'0.82rem',color:'#AAA',fontStyle:'italic',marginTop:'0.4rem',minHeight:'1.2em'}});
  const scoreBox = div({style:{margin:'0.8rem 0',padding:'0.9rem',background:'#111009',border:'1px solid #1E1C18',fontSize:'0.85rem',lineHeight:1.6,display:'none'}});

  const micBtn = btn({style:{width:64,height:64,borderRadius:'50%',border:`2px solid ${w.color}`,background:'transparent',fontSize:'1.6rem',margin:'0 auto',display:'block'}},'🎙');
  let spoken = '';
  micBtn.addEventListener('click',()=>{
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition needs Chrome.'); return; }
    const rec = new SR(); rec.lang='es-ES'; rec.continuous=false; rec.interimResults=false;
    spoken = '';
    rec.onresult = e => { spoken=e.results[0][0].transcript; spokenDisplay.textContent='🎙 Detected: "'+spoken+'"'; scoreBox.style.display='none'; };
    rec.start();
    micBtn.textContent='⏹'; micBtn.style.background=w.color;
    rec.onend=()=>{ micBtn.textContent='🎙'; micBtn.style.background='transparent'; };
  });

  const scoreBtn = btn({style:{width:'100%',background:w.color,color:'#fff',padding:'0.75rem',fontSize:'0.9rem',fontWeight:700,border:'none',marginTop:'0.8rem'}},'Score my pronunciation');
  scoreBtn.addEventListener('click', async ()=>{
    if (!spoken) return;
    scoreBtn.textContent='Analysing…'; scoreBtn.disabled=true;
    const fb = await callClaude(
      'You are a Spanish pronunciation coach. Be encouraging but precise. 3 sentences max.',
      `Student tried to say "${item.es}" (${item.en}). STT picked up: "${spoken}". Score out of 10, one issue, one tip. Format: "Score: X/10. [issue]. [tip]."`
    );
    scoreBox.textContent=fb; scoreBox.style.display='block';
    scoreBtn.textContent='Score my pronunciation'; scoreBtn.disabled=false;
  });

  const navRow = div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'0.8rem'}});
  if(idx>0) navRow.appendChild(btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.8rem',fontSize:'0.8rem'},onClick:()=>{state.exerciseIdx=idx-1;render();}},'← Prev'));
  else navRow.appendChild(div({}));
  navRow.appendChild(span({style:{color:'#666',fontSize:'0.75rem'}},(idx+1)+' / '+items.length));
  if(idx<items.length-1) navRow.appendChild(btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.4rem 0.8rem',fontSize:'0.8rem'},onClick:()=>{state.exerciseIdx=idx+1;render();}},'Next →'));
  else navRow.appendChild(div({}));

  return div({style:{padding:'1rem 1.2rem 2rem'}},
    div({style:{color:'#666',fontSize:'0.72rem',textAlign:'right',marginBottom:'0.4rem'}},(idx+1)+' / '+items.length),
    div({style:{background:'#111009',border:'1px solid #1E1C18',padding:'1.4rem',marginBottom:'1rem'}},
      div({style:{fontSize:'1.5rem',fontWeight:700,fontStyle:'italic',marginBottom:'0.3rem'}},item.es),
      div({style:{color:'#888',fontSize:'0.85rem',marginBottom:'0.5rem'}},item.en),
      div({style:{fontSize:'0.78rem',color:w.color,marginBottom:'0.4rem'}},'Focus: '+item.sounds),
      div({style:{fontSize:'0.8rem',color:'#AAA',fontStyle:'italic',marginBottom:'0.8rem'}},'💡 '+item.tip),
      btn({style:{background:w.color,border:'none',color:'#fff',padding:'0.6rem 1.2rem',fontSize:'0.9rem',marginRight:'0.5rem'},onClick:()=>speak(item.es,'es-ES',0.72)},'🔊 Slow'),
      btn({style:{background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.6rem 1.2rem',fontSize:'0.9rem'},onClick:()=>speak(item.es,'es-ES',0.95)},'🔊 Normal')
    ),
    div({style:{background:'#111009',border:'1px solid #1E1C18',padding:'1.2rem',marginBottom:'0.8rem',textAlign:'center'}},
      div({style:{fontSize:'0.72rem',textTransform:'uppercase',letterSpacing:'0.15em',color:'#666',marginBottom:'0.8rem'}},'Now you try:'),
      micBtn, spokenDisplay
    ),
    scoreBtn, scoreBox, navRow
  );
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function renderQuiz(w) {
  const items = state.exercise.items || [];
  const idx = state.exerciseIdx || 0;
  if (idx >= items.length) {
    const correct = (state.quizScore||0);
    return div({style:{padding:'2rem 1.5rem',textAlign:'center'}},
      div({style:{fontSize:'3.5rem',fontWeight:700,color:w.color,marginBottom:'0.5rem'}},correct+'/'+items.length),
      div({style:{color:'#888',marginBottom:'1.5rem'}},correct===items.length?'¡Perfecto!':correct>=3?'¡Bien! Keep going.':'Sigue practicando.'),
      btn({style:{background:w.color,color:'#fff',padding:'0.75rem 2rem',border:'none',fontSize:'0.9rem',fontWeight:700},
        onClick:()=>{state.exerciseIdx=0;state.quizScore=0;render();}},'Retry')
    );
  }
  const item = items[idx];

  const explainBox = div({style:{fontSize:'0.8rem',color:'#AAA',fontStyle:'italic',margin:'0.8rem 0',display:'none'}},item.explain);
  const nextBtn = btn({style:{background:w.color,color:'#fff',padding:'0.65rem 1.5rem',border:'none',fontSize:'0.85rem',fontWeight:700,display:'none'},
    onClick:()=>{state.exerciseIdx=idx+1;render();}},idx<items.length-1?'Next →':'See results');

  const optGrid = div({style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem',marginBottom:'0.8rem'}},
    ...item.options.map(opt=>{
      const b = btn({style:{background:'#0C0B09',border:'1px solid #2A2825',color:'#EDE8DF',padding:'0.65rem 0.4rem',fontSize:'0.78rem',textAlign:'left'}},opt);
      b.addEventListener('click',()=>{
        // Disable all
        optGrid.querySelectorAll('button').forEach(x=>x.disabled=true);
        const correct = opt===item.answer;
        if(correct){ b.style.background='#0A1F10'; b.style.borderColor='#4A9D6F'; b.style.color='#4A9D6F'; state.quizScore=(state.quizScore||0)+1; }
        else { b.style.background='#1F0A0A'; b.style.borderColor='#C0392B'; b.style.color='#C0392B';
          // highlight correct
          optGrid.querySelectorAll('button').forEach(x=>{ if(x.textContent===item.answer){x.style.background='#0A1F10';x.style.borderColor='#4A9D6F';x.style.color='#4A9D6F';} });
        }
        explainBox.style.display='block'; nextBtn.style.display='inline-block';
      });
      return b;
    })
  );

  return div({style:{padding:'1rem 1.2rem 2rem'}},
    div({style:{color:'#666',fontSize:'0.72rem',textAlign:'right',marginBottom:'0.4rem'}},(idx+1)+' / '+items.length),
    div({style:{background:'#111009',border:'1px solid #1E1C18',padding:'1.2rem'}},
      div({style:{fontSize:'1rem',fontWeight:700,marginBottom:'1rem',lineHeight:1.4}},item.q),
      optGrid, explainBox, nextBtn
    )
  );
}

// ─── CONVERSATION ─────────────────────────────────────────────────────────────
function renderConversation(w) {
  const data = state.exercise;
  const chatBox = div({style:{height:270,overflowY:'auto',background:'#080706',border:'1px solid #1E1C18',padding:'0.9rem',display:'flex',flexDirection:'column',gap:'0.5rem',marginBottom:'0.7rem'}});

  function renderMessages() {
    chatBox.innerHTML='';
    state.chatHistory.forEach(m=>{
      const isUser = m.role==='user';
      const spanishPart = m.text.includes('[Feedback:') ? m.text.split('[Feedback:')[0].trim() : m.text;
      const feedbackPart = m.text.includes('[Feedback:') ? '[Feedback:'+m.text.split('[Feedback:')[1] : '';
      const bubble = div({style:{maxWidth:'82%',padding:'0.6rem 0.8rem',fontSize:'0.85rem',lineHeight:1.55,
        alignSelf:isUser?'flex-end':'flex-start',
        background:isUser?w.color:'#111009',
        border:isUser?'none':'1px solid #1E1C18',
        color:'#EDE8DF',wordBreak:'break-word'}},
        spanishPart
      );
      if (feedbackPart) {
        bubble.appendChild(div({style:{fontSize:'0.75rem',color:isUser?'rgba(255,255,255,0.7)':'#888',fontStyle:'italic',marginTop:'0.3rem'}},feedbackPart));
      }
      if (!isUser) {
        const replayBtn = btn({style:{background:'none',border:'none',color:'rgba(255,255,255,0.4)',fontSize:'0.8rem',float:'right',marginLeft:4},onClick:()=>speak(spanishPart)},'🔊');
        bubble.insertBefore(replayBtn,bubble.firstChild);
      }
      chatBox.appendChild(bubble);
    });
    chatBox.scrollTop=chatBox.scrollHeight;
  }

  renderMessages();

  const typingIndicator = div({style:{color:'#555',letterSpacing:4,alignSelf:'flex-start',padding:'0.5rem',display:'none'}},'● ● ●');
  chatBox.appendChild(typingIndicator);

  async function send(text) {
    if (!text.trim()) return;
    state.chatHistory.push({role:'user',text});
    renderMessages();
    typingIndicator.style.display='block';
    chatBox.scrollTop=chatBox.scrollHeight;

    const msgs = state.chatHistory.map(m=>({role:m.role,content:m.text}));
    const sys = `You are a native Spanish speaker. Scenario: ${data.scenario}. Speak ONLY Spanish at A2 level. Max 2 sentences. After your reply add: [Feedback: one correction or compliment in English]`;
    const reply = await callClaude(sys, msgs, 300);
    typingIndicator.style.display='none';
    state.chatHistory.push({role:'assistant',text:reply});
    renderMessages();
    speak(reply.split('[Feedback:')[0].trim());
  }

  const textInput = el('input',{type:'text',placeholder:'Escribe en español…',
    style:{flex:1,background:'#111009',border:'1px solid #2A2825',color:'#EDE8DF',padding:'0.65rem 0.8rem',fontSize:'0.9rem'}});
  textInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){send(textInput.value);textInput.value='';} });

  const sendBtn = btn({style:{background:w.color,color:'#fff',border:'none',padding:'0.65rem 1rem',fontSize:'1rem'},
    onClick:()=>{ send(textInput.value); textInput.value=''; }},'→');

  const micBtn = btn({style:{width:56,height:56,borderRadius:'50%',border:`2px solid ${w.color}`,background:'transparent',fontSize:'1.4rem',margin:'0 auto',display:'block'}},'🎙');
  micBtn.addEventListener('click',()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Speech recognition needs Chrome.');return;}
    const rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=false;
    rec.onresult=e=>{send(e.results[0][0].transcript);};
    rec.start();
    micBtn.textContent='⏹';micBtn.style.background=w.color;
    rec.onend=()=>{micBtn.textContent='🎙';micBtn.style.background='transparent';};
  });

  let voiceMode = true;
  const voicePanel = div({style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'0.5rem',padding:'0.8rem',background:'#111009',border:'1px solid #1E1C18'}},
    micBtn, div({style:{fontSize:'0.75rem',color:'#666'}},'Tap mic to speak in Spanish'));
  const typePanel = div({style:{display:'flex',gap:'0.5rem',display:'none'}}, textInput, sendBtn);

  const toggleVoice = btn({style:{flex:1,background:w.color,border:`1px solid ${w.color}`,color:'#fff',padding:'0.5rem',fontSize:'0.8rem'}},'🎙 Voice');
  const toggleType = btn({style:{flex:1,background:'none',border:'1px solid #2A2825',color:'#AAA',padding:'0.5rem',fontSize:'0.8rem'}},'⌨️ Type');
  toggleVoice.addEventListener('click',()=>{voiceMode=true;voicePanel.style.display='flex';typePanel.style.display='none';toggleVoice.style.background=w.color;toggleVoice.style.color='#fff';toggleType.style.background='none';toggleType.style.color='#AAA';});
  toggleType.addEventListener('click',()=>{voiceMode=false;voicePanel.style.display='none';typePanel.style.display='flex';toggleType.style.background=w.color;toggleType.style.color='#fff';toggleVoice.style.background='none';toggleVoice.style.color='#AAA';});

  return div({style:{padding:'0 1.2rem 2rem'}},
    div({style:{background:'#111009',border:'1px solid #1E1C18',padding:'0.9rem',marginBottom:'0.8rem',fontSize:'0.85rem',lineHeight:1.5}},
      el('strong',{},'📍 '+data.scenario),
      data.tips?.length ? div({style:{display:'flex',flexWrap:'wrap',gap:'0.4rem',marginTop:'0.6rem'}},
        ...data.tips.map(t=>span({style:{fontSize:'0.72rem',padding:'0.2rem 0.5rem',border:'1px solid #2A2825',cursor:'pointer',color:'#AAA'},onClick:()=>speak(t)},'🔊 '+t))
      ) : null
    ),
    chatBox,
    div({style:{display:'flex',gap:'0.5rem',marginBottom:'0.7rem'}}, toggleVoice, toggleType),
    voicePanel, typePanel
  );
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
