<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Habla Español — DELE A2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0B09;font-family:'Palatino Linotype',Palatino,serif;color:#EDE8DF;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:2rem}
button{cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit;outline:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fadein 0.25s ease}
.spinner{width:28px;height:28px;border:3px solid #333;border-top-color:#C0392B;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROXY = 'https://sparkling-frog-5ddd.mmabobmasters.workers.dev';

const WEEKS = [
  {week:1,color:'#C0392B',title:'Consolidating the Present',lessons:[
    {id:'1-1',day:1,title:'Ser vs Estar — the real rules',grammar:'Ser/estar with adjectives that change meaning',focus:'permanence vs state, emotion, location'},
    {id:'1-2',day:2,title:'Reflexive verbs in context',grammar:'Reflexive + daily routine verbs',focus:'levantarse, ponerse, quedarse, llevarse bien'},
    {id:'1-3',day:3,title:'Gustar & verbs like it',grammar:'Indirect object pronouns + gustar/doler/parecer/encantar',focus:'me/te/le/nos/os/les'},
    {id:'1-4',day:4,title:'Expressing obligation & ability',grammar:'Tener que / hay que / poder / deber',focus:'modal constructions at A2'},
    {id:'1-5',day:5,title:'Quantifiers & intensifiers',grammar:'Muy, mucho, bastante, demasiado, poco, nada',focus:'agreement and placement'},
    {id:'1-6',day:6,title:'Question forms deep dive',grammar:'All interrogative pronouns in complex sentences',focus:'qué vs cuál, por qué vs para qué'},
    {id:'1-7',day:7,title:'Week 1 Voice Mock',grammar:'Oral production — present tense',focus:'DELE A2 speaking task simulation'},
  ]},
  {week:2,color:'#D35400',title:'Mastering the Past',lessons:[
    {id:'2-1',day:8,title:'Pretérito Indefinido — irregulars',grammar:'Irregular stems: andar, poner, saber, querer, venir',focus:'fui/vine/tuve/hice/dije patterns'},
    {id:'2-2',day:9,title:'Pretérito Imperfecto',grammar:'Imperfecto formation + key uses',focus:'describing past states, habitual past'},
    {id:'2-3',day:10,title:'Indefinido vs Imperfecto',grammar:'Contrast: completed action vs background',focus:'narrative past — the critical A2 distinction'},
    {id:'2-4',day:11,title:'Time expressions that signal tense',grammar:'Ayer/anoche vs siempre/antes/cuando era niño',focus:'temporal markers as tense cues'},
    {id:'2-5',day:12,title:'Talking about past experiences',grammar:'Ya/todavía no + indefinido',focus:'¿Alguna vez…? response patterns'},
    {id:'2-6',day:13,title:'Describing people & places in the past',grammar:'Imperfecto for description vs indefinido for events',focus:'narrative construction'},
    {id:'2-7',day:14,title:'Week 2 Voice Mock',grammar:'Oral production — past tenses',focus:'DELE A2 narrating a past event'},
  ]},
  {week:3,color:'#1A7A4A',title:'Future, Opinions & Discourse',lessons:[
    {id:'3-1',day:15,title:'Future tense — regular & irregular',grammar:'Futuro simple: formation + irregulars',focus:'predictions vs plans'},
    {id:'3-2',day:16,title:'Condicional introduction',grammar:'Condicional simple for polite requests',focus:'gustaría, podría, debería'},
    {id:'3-3',day:17,title:'Expressing opinions confidently',grammar:'Creo que / me parece que / en mi opinión',focus:'agreement, disagreement, hedging'},
    {id:'3-4',day:18,title:'Connectors & discourse markers',grammar:'Addition, contrast, consequence connectors',focus:'además, sin embargo, por eso, aunque'},
    {id:'3-5',day:19,title:'Making comparisons',grammar:'Más/menos que, tan…como, superlatives',focus:'comparative sentences in speech'},
    {id:'3-6',day:20,title:'Likes, dislikes & preferences',grammar:'Preferir, odiar, soportar + infinitive/noun',focus:'nuanced opinion vocabulary'},
    {id:'3-7',day:21,title:'Week 3 Voice Mock',grammar:'Oral production — opinions & future',focus:'DELE A2 giving and defending a view'},
  ]},
  {week:4,color:'#2471A3',title:'DELE A2 Exam Technique',lessons:[
    {id:'4-1',day:22,title:'Reading: extract key information',grammar:'Scanning, skimming, inference at A2',focus:'DELE Comprensión de Lectura task types'},
    {id:'4-2',day:23,title:'Listening: real-pace dialogues',grammar:'Listening for gist + specific detail',focus:'DELE Comprensión Auditiva strategies'},
    {id:'4-3',day:24,title:'Writing: structured short texts',grammar:'Email/message register, cohesion',focus:'DELE Expresión Escrita — 50-80 word tasks'},
    {id:'4-4',day:25,title:'Speaking task 1 — describe & react',grammar:'Valuation of images/situations',focus:'DELE Expresión Oral Part 1'},
    {id:'4-5',day:26,title:'Speaking task 2 — role play',grammar:'Transactional language: asking, clarifying',focus:'DELE Expresión Oral Part 2'},
    {id:'4-6',day:27,title:'Full timed mock — Written',grammar:'All written DELE A2 task types',focus:'Comprensión + Escritura'},
    {id:'4-7',day:28,title:'🎓 Full mock — Oral + Review',grammar:'Oral mock + personalised feedback',focus:'DELE Expresión Oral full simulation'},
  ]},
];

// State
let S = {
  screen: 'home',
  weekIdx: 0,
  lesson: null,
  mode: null,
  exercise: null,
  loading: false,
  chatHistory: [],
  exIdx: 0,
  quizScore: 0,
  progress: {},
  xp: 0,
};
try { S.progress = JSON.parse(localStorage.getItem('a2p')||'{}'); } catch(e){}
S.xp = parseInt(localStorage.getItem('a2x')||'0');

function save() {
  localStorage.setItem('a2p', JSON.stringify(S.progress));
  localStorage.setItem('a2x', S.xp);
}

// TTS
let bestVoice = null;
function loadVoices() {
  const vs = speechSynthesis.getVoices();
  const prefs = [
    v=>v.name==='Google español'&&v.lang==='es-ES',
    v=>v.name.includes('Google')&&v.lang.startsWith('es'),
    v=>v.name==='Mónica',v=>v.name.includes('Monica'),
    v=>v.name.includes('Paulina'),
    v=>v.name.includes('Microsoft')&&v.lang.startsWith('es'),
    v=>v.lang==='es-ES', v=>v.lang.startsWith('es'),
  ];
  for(const p of prefs){const v=vs.find(p);if(v){bestVoice=v;break;}}
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text, rate) {
  speechSynthesis.cancel();
  const go = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang='es-ES'; u.rate=rate||0.88;
    if(bestVoice) u.voice=bestVoice;
    speechSynthesis.speak(u);
  };
  speechSynthesis.getVoices().length ? go() : setTimeout(go,300);
}

// API
async function ai(system, userMsg, max) {
  const messages = Array.isArray(userMsg)?userMsg:[{role:'user',content:userMsg}];
  const r = await fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max||800,system,messages})
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message||'API error');
  return d.content[0].text;
}

// Render
const app = document.getElementById('app');
function render() {
  app.className = 'fade';
  void app.offsetWidth;
  if(S.screen==='home') renderHome();
  else if(S.screen==='map') renderMap();
  else if(S.screen==='lesson') renderLesson();
  else if(S.screen==='exercise') renderExercise();
}

function hdr(back, backFn, right) {
  const h = document.createElement('div');
  h.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:0.9rem 1.5rem;border-bottom:1px solid #1A1816;background:#0C0B09;position:sticky;top:0;z-index:10';
  const b = document.createElement('button');
  b.textContent=back;
  b.style.cssText='background:none;border:1px solid #2A2825;color:#AAA;padding:0.4rem 0.9rem;font-size:0.82rem;font-family:inherit';
  b.onclick=backFn;
  h.appendChild(b);
  if(right){const s=document.createElement('span');s.innerHTML=right;h.appendChild(s);}
  return h;
}

// HOME
function renderHome() {
  const total=WEEKS.reduce((a,w)=>a+w.lessons.length,0);
  const done=Object.keys(S.progress).length;
  const pct=Math.round(done/total*100);
  app.innerHTML = `
    <div style="min-height:100vh;padding:3rem 1.8rem 2rem;position:relative;overflow:hidden;background:#0C0B09">
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#C0392B,#D35400,#1A7A4A,#2471A3)"></div>
      <p style="font-size:0.65rem;letter-spacing:0.2em;color:#C0392B;text-transform:uppercase;margin-bottom:0.8rem">DELE A2 · Low A2 → Certified</p>
      <h1 style="font-size:clamp(2.8rem,11vw,4.5rem);font-weight:700;line-height:1.05;margin-bottom:1rem;font-style:italic">habla<br><span style="color:#C0392B">español.</span></h1>
      <p style="font-size:0.9rem;color:#999;line-height:1.7;max-width:320px;margin-bottom:1.5rem">Voice-first Spanish. 28 lessons. Real pronunciation feedback. AI conversation partner.</p>
      <div style="display:flex;gap:1.5rem;margin-bottom:1rem">
        <div><div style="font-size:1.3rem;font-weight:700;color:#D35400">${done}/${total}</div><div style="font-size:0.6rem;color:#666;text-transform:uppercase;letter-spacing:0.15em">Lessons</div></div>
        <div><div style="font-size:1.3rem;font-weight:700;color:#D35400">${S.xp}</div><div style="font-size:0.6rem;color:#666;text-transform:uppercase;letter-spacing:0.15em">XP</div></div>
        <div><div style="font-size:1.3rem;font-weight:700;color:#D35400">${pct}%</div><div style="font-size:0.6rem;color:#666;text-transform:uppercase;letter-spacing:0.15em">Progress</div></div>
      </div>
      <div style="height:3px;background:#1A1816;border-radius:2px;margin-bottom:2rem;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#C0392B,#D35400);width:${pct}%;transition:width 0.6s"></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:2rem">
        ${['🔊 TTS Playback','🎙 Voice Input','🗣 AI Conversation','📊 Pronunciation Score'].map(b=>`<span style="font-size:0.7rem;padding:0.25rem 0.6rem;border:1px solid #2A2825;border-radius:20px;color:#AAA">${b}</span>`).join('')}
      </div>
      <button id="startBtn" style="background:#C0392B;color:#fff;border:none;padding:0.9rem 2.2rem;font-size:1rem;font-weight:700;letter-spacing:0.05em">${done===0?'Empezamos →':'Continuar →'}</button>
    </div>`;
  document.getElementById('startBtn').onclick = ()=>{S.screen='map';render();};
}

// MAP
function renderMap() {
  const w = WEEKS[S.weekIdx];
  app.innerHTML = '';
  app.appendChild(hdr('← Home', ()=>{S.screen='home';render();}, `<span style="color:#D35400;font-size:0.85rem;font-weight:700">⚡ ${S.xp} XP</span>`));

  // Week tabs
  const tabs = document.createElement('div');
  tabs.style.cssText='display:flex;border-bottom:1px solid #1A1816;background:#0C0B09';
  WEEKS.forEach((wk,i)=>{
    const t=document.createElement('button');
    t.textContent='W'+wk.week;
    t.style.cssText=`flex:1;background:none;border:none;border-bottom:3px solid ${i===S.weekIdx?wk.color:'transparent'};color:${i===S.weekIdx?wk.color:'#555'};padding:0.85rem 0.3rem;font-weight:${i===S.weekIdx?700:400};font-size:0.85rem`;
    t.onclick=()=>{S.weekIdx=i;renderMap();};
    tabs.appendChild(t);
  });
  app.appendChild(tabs);

  // Banner
  const banner = document.createElement('div');
  banner.style.cssText='padding:0.9rem 1.5rem;display:flex;align-items:center;gap:0.8rem;border-bottom:1px solid #1A1816';
  banner.innerHTML=`<span style="font-size:0.65rem;color:${w.color};text-transform:uppercase;letter-spacing:0.2em;font-weight:700">Week ${w.week}</span><span style="font-weight:700;font-size:1rem;font-style:italic">${w.title}</span>`;
  app.appendChild(banner);

  // Lessons
  const list = document.createElement('div');
  list.style.cssText='padding:0.5rem 1.2rem 3rem';
  w.lessons.forEach((l,i)=>{
    const isDone=!!S.progress[l.id];
    const prevDone=i===0?true:!!S.progress[w.lessons[i-1].id];
    const locked=!isDone&&!prevDone;
    const card=document.createElement('div');
    card.style.cssText=`display:flex;align-items:center;padding:1rem 0.9rem;margin:0.5rem 0;background:#111009;border-left:4px solid ${locked?'#2A2825':w.color};cursor:${locked?'default':'pointer'};gap:0.8rem;opacity:${locked?0.3:1}`;
    card.innerHTML=`
      <span style="font-size:0.6rem;color:#666;text-transform:uppercase;letter-spacing:0.1em;min-width:28px;flex-shrink:0">D${l.day}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:0.92rem;font-weight:700;margin-bottom:2px">${l.title}</div>
        <div style="font-size:0.72rem;color:#888;font-style:italic">${l.focus}</div>
      </div>
      <span style="font-size:1rem;flex-shrink:0;color:${isDone?'#4A9D6F':locked?'#555':w.color};font-weight:700">${isDone?'✓':locked?'🔒':'→'}</span>`;
    if(!locked) card.onclick=()=>{S.lesson=l;S.mode=null;S.screen='lesson';render();};
    list.appendChild(card);
  });
  app.appendChild(list);
}

// LESSON
function renderLesson() {
  const l=S.lesson;
  const w=WEEKS.find(wk=>wk.lessons.some(x=>x.id===l.id));
  const isDone=!!S.progress[l.id];
  app.innerHTML='';
  app.appendChild(hdr('← Map',()=>{S.screen='map';render();},`<span style="color:#D35400;font-size:0.85rem;font-weight:700">⚡ ${S.xp} XP</span>`));

  const hero=document.createElement('div');
  hero.style.cssText=`padding:1.5rem;background:${w.color};color:#fff`;
  hero.innerHTML=`
    <div style="font-size:0.65rem;text-transform:uppercase;letter-spacing:0.2em;opacity:0.75;margin-bottom:0.4rem">Day ${l.day} · Week ${w.week}</div>
    <h2 style="margin:0 0 0.3rem;font-size:1.3rem;font-weight:700">${l.title}</h2>
    <div style="opacity:0.85;font-size:0.82rem;font-style:italic;margin-bottom:0.8rem">${l.grammar}</div>`;
  const hearBtn=document.createElement('button');
  hearBtn.textContent='🔊 Hear topic';
  hearBtn.style.cssText='background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.35);color:#fff;padding:0.35rem 0.9rem;font-size:0.78rem';
  hearBtn.onclick=()=>speak(l.title+'. '+l.grammar);
  hero.appendChild(hearBtn);
  app.appendChild(hero);

  const body=document.createElement('div');
  body.style.cssText='padding:1.2rem 1.5rem';
  body.innerHTML=`<div style="font-size:0.65rem;text-transform:uppercase;letter-spacing:0.2em;color:#666;margin-bottom:0.8rem">Choose practice mode</div>`;

  [{id:'drill',icon:'⚡',label:'Grammar Drills',desc:'Fill-blanks + voice answer'},
   {id:'pronunciation',icon:'🔊',label:'Pronunciation Lab',desc:'Hear + repeat + get scored'},
   {id:'conversation',icon:'🗣',label:'Voice Conversation',desc:'Full spoken AI dialogue'},
   {id:'quiz',icon:'🎯',label:'DELE Quiz',desc:'Exam-style questions'}].forEach(m=>{
    const b=document.createElement('button');
    b.style.cssText='display:flex;align-items:center;gap:1rem;width:100%;background:#111009;border:1px solid #1E1C18;padding:0.9rem 1rem;margin-bottom:0.5rem;color:#EDE8DF;text-align:left';
    b.innerHTML=`<span style="font-size:1.4rem;width:32px;text-align:center;flex-shrink:0">${m.icon}</span><div><div style="font-weight:700;font-size:0.9rem;margin-bottom:2px">${m.label}</div><div style="font-size:0.75rem;color:#888">${m.desc}</div></div>`;
    b.onclick=()=>{S.mode=m.id;S.screen='exercise';S.exercise=null;S.loading=true;S.exIdx=0;S.quizScore=0;S.chatHistory=[];render();loadEx();};
    body.appendChild(b);
  });

  if(!isDone){
    const db=document.createElement('button');
    db.textContent='Mark complete (+60 XP) ✓';
    db.style.cssText='width:100%;margin-top:0.8rem;border:1px solid #4A9D6F;background:none;color:#4A9D6F;padding:0.7rem;font-size:0.85rem';
    db.onclick=()=>{S.progress[l.id]=true;S.xp+=60;save();S.screen='map';render();};
    body.appendChild(db);
  } else {
    const d=document.createElement('div');
    d.style.cssText='margin-top:0.8rem;color:#4A9D6F;font-size:0.85rem;text-align:center';
    d.textContent='✅ Complete — keep practising!';
    body.appendChild(d);
  }
  app.appendChild(body);
}

// EXERCISE
function renderExercise() {
  const l=S.lesson;
  const w=WEEKS.find(wk=>wk.lessons.some(x=>x.id===l.id));
  app.innerHTML='';
  const modeLabels={drill:'⚡ Drills',pronunciation:'🔊 Pronunciation',conversation:'🗣 Conversation',quiz:'🎯 Quiz'};
  app.appendChild(hdr('← Back',()=>{S.screen='lesson';render();},`<span style="color:${w.color};font-size:0.8rem">${modeLabels[S.mode]}</span>`));

  if(S.loading){
    const ld=document.createElement('div');
    ld.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;gap:1rem';
    ld.innerHTML=`<div class="spinner" style="border-top-color:${w.color}"></div><div style="color:#888;font-size:0.9rem">Generating exercise…</div><div style="color:#555;font-size:0.75rem">Usually 3–6 seconds</div>`;
    app.appendChild(ld);
    return;
  }

  if(!S.exercise||S.exercise.error){
    const err=document.createElement('div');
    err.style.cssText='padding:2rem 1.5rem;text-align:center';
    err.innerHTML=`<div style="color:#C0392B;margin-bottom:1rem">${S.exercise?.error||'Something went wrong.'}</div>`;
    const rb=document.createElement('button');
    rb.textContent='Retry';
    rb.style.cssText=`background:${w.color};color:#fff;border:none;padding:0.7rem 1.5rem;font-size:0.9rem`;
    rb.onclick=()=>{S.loading=true;S.exercise=null;render();loadEx();};
    err.appendChild(rb);
    app.appendChild(err);
    return;
  }

  if(S.mode==='drill') renderDrill(w);
  else if(S.mode==='pronunciation') renderPron(w);
  else if(S.mode==='quiz') renderQuiz(w);
  else if(S.mode==='conversation') renderConvo(w);
}

async function loadEx() {
  const l=S.lesson;
  const sys='You are a DELE A2 Spanish teacher. Return ONLY valid JSON. No markdown, no backticks, no explanation.';
  let prompt='';
  if(S.mode==='drill')
    prompt=`Create 5 fill-in-the-blank sentences for low A2 Spanish learner. Topic:"${l.title}". Grammar:"${l.grammar}". Return JSON: {"type":"drill","items":[{"sentence":"Spanish sentence with ___ gap","answer":"word","hint":"English grammar tip","full":"complete correct sentence"}]}`;
  else if(S.mode==='pronunciation')
    prompt=`Create 6 Spanish phrases for A2 pronunciation practice. Topic:"${l.title}". Return JSON: {"type":"pronunciation","items":[{"es":"phrase","en":"English meaning","tip":"pronunciation tip","sounds":"key sounds"}]}`;
  else if(S.mode==='quiz')
    prompt=`Create 5 DELE A2 multiple choice questions. Topic:"${l.title}". Grammar:"${l.grammar}". Return JSON: {"type":"quiz","items":[{"q":"question","options":["A. text","B. text","C. text","D. text"],"answer":"A. text","explain":"brief reason"}]}`;
  else if(S.mode==='conversation')
    prompt=`Create A2 Spanish conversation scenario. Topic:"${l.title}". Return JSON: {"type":"conversation","scenario":"1-sentence situation in English","opener":"first Spanish line from AI partner (A2 level, 1 sentence)","tips":["key phrase 1","key phrase 2","key phrase 3"]}`;
  try {
    const raw=await ai(sys,prompt);
    S.exercise=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(S.mode==='conversation'){
      S.chatHistory=[{role:'assistant',text:S.exercise.opener}];
      speak(S.exercise.opener);
    }
  } catch(e) {
    S.exercise={error:'Could not load exercise — tap Retry.'};
  }
  S.loading=false;
  render();
}

// DRILL
function renderDrill(w) {
  const items=S.exercise.items||[];
  const idx=S.exIdx||0;
  const item=items[idx];
  if(!item){const d=document.createElement('div');d.style.cssText='padding:2rem;text-align:center;color:#4A9D6F;font-size:1.1rem';d.textContent='🎉 All drills done!';app.appendChild(d);return;}
  const parts=(item.sentence||'').split('___');

  const wrap=document.createElement('div');
  wrap.style.cssText='padding:1rem 1.2rem 2rem';

  const counter=document.createElement('div');
  counter.style.cssText='color:#666;font-size:0.72rem;text-align:right;margin-bottom:0.4rem';
  counter.textContent=(idx+1)+' / '+items.length;
  wrap.appendChild(counter);

  const card=document.createElement('div');
  card.style.cssText='background:#111009;border:1px solid #1E1C18;padding:1.2rem;margin-bottom:1rem';

  const hint=document.createElement('div');
  hint.style.cssText='font-size:0.78rem;color:#888;font-style:italic;margin-bottom:0.8rem';
  hint.textContent='💡 '+(item.hint||'');
  card.appendChild(hint);

  const sentDiv=document.createElement('div');
  sentDiv.style.cssText='font-size:1.05rem;line-height:2.2;margin-bottom:0.5rem';

  const answerSpan=document.createElement('span');
  answerSpan.style.cssText=`border-bottom:2px solid ${w.color};min-width:80px;display:inline-block;text-align:center;color:${w.color};margin:0 6px;font-size:1.05rem`;
  answerSpan.textContent='___';

  sentDiv.appendChild(document.createTextNode(parts[0]||''));
  sentDiv.appendChild(answerSpan);
  sentDiv.appendChild(document.createTextNode(parts[1]||''));
  card.appendChild(sentDiv);

  const hearBtn=document.createElement('button');
  hearBtn.textContent='🔊 Hear full sentence';
  hearBtn.style.cssText='background:none;border:none;color:#888;font-size:0.78rem;cursor:pointer';
  hearBtn.onclick=()=>speak(item.full||item.answer);
  card.appendChild(hearBtn);
  wrap.appendChild(card);

  // Input row
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:0.6rem;align-items:center;margin-bottom:0.5rem';

  const inp=document.createElement('input');
  inp.type='text';inp.placeholder='Type your answer…';
  inp.style.cssText='flex:1;background:#111009;border:1px solid #2A2825;color:#EDE8DF;padding:0.65rem 0.8rem;font-size:0.9rem';
  let currentAnswer='';
  inp.oninput=e=>{currentAnswer=e.target.value;answerSpan.textContent=e.target.value||'___';};
  inp.onkeydown=e=>{if(e.key==='Enter')checkBtn.click();};

  const mic=document.createElement('button');
  mic.textContent='🎙';
  mic.style.cssText=`width:42px;height:42px;border-radius:50%;border:2px solid ${w.color};background:transparent;font-size:1.1rem;flex-shrink:0`;
  mic.onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Speech recognition needs Chrome.');return;}
    const rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=false;
    rec.onresult=e=>{const t=e.results[0][0].transcript;inp.value=t;currentAnswer=t;answerSpan.textContent=t;};
    rec.start();mic.textContent='⏹';mic.style.background=w.color;
    rec.onend=()=>{mic.textContent='🎙';mic.style.background='transparent';};
  };
  row.appendChild(inp);row.appendChild(mic);
  wrap.appendChild(row);

  const checkBtn=document.createElement('button');
  checkBtn.textContent='Check Answer';
  checkBtn.style.cssText=`width:100%;background:${w.color};color:#fff;border:none;padding:0.75rem;font-size:0.9rem;font-weight:700;margin-bottom:0.5rem`;
  wrap.appendChild(checkBtn);

  const fbBox=document.createElement('div');
  fbBox.style.cssText='margin:0.5rem 0;padding:0.9rem;background:#111009;border:1px solid #1E1C18;font-size:0.85rem;line-height:1.6;display:none';
  wrap.appendChild(fbBox);

  checkBtn.onclick=async()=>{
    if(!currentAnswer.trim())return;
    checkBtn.textContent='Checking…';checkBtn.disabled=true;
    try{
      const fb=await ai('You are a kind DELE A2 Spanish teacher. 2 sentences max. Start ✅ if correct or ❌ if wrong.',
        `Student filled blank with "${currentAnswer}". Sentence: "${item.sentence}". Correct answer: "${item.answer}". Give feedback.`);
      fbBox.textContent=fb+' | Correct: '+item.answer;fbBox.style.display='block';
      speak(item.full||item.answer);
    }catch(e){fbBox.textContent='Could not check — try again.';fbBox.style.display='block';}
    checkBtn.textContent='Check Answer';checkBtn.disabled=false;
  };

  // Nav
  const nav=document.createElement('div');
  nav.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:0.8rem';
  const pb=document.createElement('button');
  pb.textContent='← Prev';pb.style.cssText='background:none;border:1px solid #2A2825;color:#AAA;padding:0.4rem 0.8rem;font-size:0.8rem';
  pb.disabled=idx===0;pb.onclick=()=>{S.exIdx--;render();};
  const nb=document.createElement('button');
  nb.textContent='Next →';nb.style.cssText='background:none;border:1px solid #2A2825;color:#AAA;padding:0.4rem 0.8rem;font-size:0.8rem';
  nb.disabled=idx>=items.length-1;nb.onclick=()=>{S.exIdx++;render();};
  const ct=document.createElement('span');ct.style.cssText='color:#666;font-size:0.75rem';ct.textContent=(idx+1)+'/'+items.length;
  nav.appendChild(pb);nav.appendChild(ct);nav.appendChild(nb);
  wrap.appendChild(nav);
  app.appendChild(wrap);
}

// PRONUNCIATION
function renderPron(w) {
  const items=S.exercise.items||[];
  const idx=S.exIdx||0;
  const item=items[idx];
  if(!item){const d=document.createElement('div');d.style.cssText='padding:2rem;text-align:center;color:#4A9D6F;font-size:1.1rem';d.textContent='🎉 All phrases done!';app.appendChild(d);return;}

  const wrap=document.createElement('div');
  wrap.style.cssText='padding:1rem 1.2rem 2rem';

  const counter=document.createElement('div');
  counter.style.cssText='color:#666;font-size:0.72rem;text-align:right;margin-bottom:0.4rem';
  counter.textContent=(idx+1)+' / '+items.length;
  wrap.appendChild(counter);

  const card=document.createElement('div');
  card.style.cssText='background:#111009;border:1px solid #1E1C18;padding:1.4rem;margin-bottom:1rem';
  card.innerHTML=`
    <div style="font-size:1.5rem;font-weight:700;font-style:italic;margin-bottom:0.3rem">${item.es}</div>
    <div style="color:#888;font-size:0.85rem;margin-bottom:0.5rem">${item.en}</div>
    <div style="font-size:0.78rem;color:${w.color};margin-bottom:0.4rem">Focus: ${item.sounds}</div>
    <div style="font-size:0.8rem;color:#AAA;font-style:italic;margin-bottom:0.8rem">💡 ${item.tip}</div>`;
  const slowBtn=document.createElement('button');
  slowBtn.textContent='🔊 Slow';slowBtn.style.cssText=`background:${w.color};border:none;color:#fff;padding:0.6rem 1.2rem;font-size:0.9rem;margin-right:0.5rem`;
  slowBtn.onclick=()=>speak(item.es,0.72);
  const normBtn=document.createElement('button');
  normBtn.textContent='🔊 Normal';normBtn.style.cssText='background:none;border:1px solid #2A2825;color:#AAA;padding:0.6rem 1.2rem;font-size:0.9rem';
  normBtn.onclick=()=>speak(item.es,0.95);
  card.appendChild(slowBtn);card.appendChild(normBtn);
  wrap.appendChild(card);

  const recArea=document.createElement('div');
  recArea.style.cssText='background:#111009;border:1px solid #1E1C18;padding:1.2rem;margin-bottom:0.8rem;text-align:center';
  recArea.innerHTML='<div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.15em;color:#666;margin-bottom:0.8rem">Now you try:</div>';

  const mic=document.createElement('button');
  mic.textContent='🎙';mic.style.cssText=`width:64px;height:64px;border-radius:50%;border:2px solid ${w.color};background:transparent;font-size:1.6rem;display:block;margin:0 auto`;

  const spokenDiv=document.createElement('div');
  spokenDiv.style.cssText='font-size:0.82rem;color:#AAA;font-style:italic;margin-top:0.5rem;min-height:1.2em';

  let spoken='';
  mic.onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Speech recognition needs Chrome.');return;}
    const rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=false;
    rec.onresult=e=>{spoken=e.results[0][0].transcript;spokenDiv.textContent='🎙 Detected: "'+spoken+'"';scoreBox.style.display='none';};
    rec.start();mic.textContent='⏹';mic.style.background=w.color;
    rec.onend=()=>{mic.textContent='🎙';mic.style.background='transparent';};
  };
  recArea.appendChild(mic);recArea.appendChild(spokenDiv);
  wrap.appendChild(recArea);

  const scoreBtn=document.createElement('button');
  scoreBtn.textContent='Score my pronunciation';
  scoreBtn.style.cssText=`width:100%;background:${w.color};color:#fff;border:none;padding:0.75rem;font-size:0.9rem;font-weight:700;margin-bottom:0.5rem`;

  const scoreBox=document.createElement('div');
  scoreBox.style.cssText='margin:0.5rem 0;padding:0.9rem;background:#111009;border:1px solid #1E1C18;font-size:0.85rem;line-height:1.6;display:none';

  scoreBtn.onclick=async()=>{
    if(!spoken)return;
    scoreBtn.textContent='Analysing…';scoreBtn.disabled=true;
    try{
      const fb=await ai('You are a Spanish pronunciation coach. Be encouraging but precise. 3 sentences max.',
        `Student tried to say "${item.es}" (${item.en}). STT picked up: "${spoken}". Score out of 10, one issue, one tip. Format: "Score: X/10. [issue]. [tip]."`);
      scoreBox.textContent=fb;scoreBox.style.display='block';
    }catch(e){scoreBox.textContent='Could not score — try again.';scoreBox.style.display='block';}
    scoreBtn.textContent='Score my pronunciation';scoreBtn.disabled=false;
  };
  wrap.appendChild(scoreBtn);wrap.appendChild(scoreBox);

  const nav=document.createElement('div');
  nav.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:0.8rem';
  const pb=document.createElement('button');pb.textContent='← Prev';pb.style.cssText='background:none;border:1px solid #2A2825;color:#AAA;padding:0.4rem 0.8rem;font-size:0.8rem';pb.disabled=idx===0;pb.onclick=()=>{S.exIdx--;render();};
  const nb=document.createElement('button');nb.textContent='Next →';nb.style.cssText='background:none;border:1px solid #2A2825;color:#AAA;padding:0.4rem 0.8rem;font-size:0.8rem';nb.disabled=idx>=items.length-1;nb.onclick=()=>{S.exIdx++;render();};
  const ct=document.createElement('span');ct.style.cssText='color:#666;font-size:0.75rem';ct.textContent=(idx+1)+'/'+items.length;
  nav.appendChild(pb);nav.appendChild(ct);nav.appendChild(nb);
  wrap.appendChild(nav);
  app.appendChild(wrap);
}

// QUIZ
function renderQuiz(w) {
  const items=S.exercise.items||[];
  const idx=S.exIdx||0;

  if(idx>=items.length){
    const done=document.createElement('div');
    done.style.cssText='padding:2.5rem 1.5rem;text-align:center';
    done.innerHTML=`<div style="font-size:3.5rem;font-weight:700;color:${w.color};margin-bottom:0.5rem">${S.quizScore}/${items.length}</div>
      <div style="color:#888;margin-bottom:1.5rem">${S.quizScore===items.length?'¡Perfecto!':S.quizScore>=3?'¡Bien! Keep going.':'Sigue practicando.'}</div>`;
    const rb=document.createElement('button');rb.textContent='Retry';rb.style.cssText=`background:${w.color};color:#fff;border:none;padding:0.75rem 2rem;font-size:0.9rem;font-weight:700`;
    rb.onclick=()=>{S.exIdx=0;S.quizScore=0;render();};
    done.appendChild(rb);app.appendChild(done);return;
  }

  const item=items[idx];
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:1rem 1.2rem 2rem';

  const counter=document.createElement('div');
  counter.style.cssText='color:#666;font-size:0.72rem;text-align:right;margin-bottom:0.4rem';
  counter.textContent=(idx+1)+' / '+items.length;
  wrap.appendChild(counter);

  const card=document.createElement('div');
  card.style.cssText='background:#111009;border:1px solid #1E1C18;padding:1.2rem';

  const q=document.createElement('div');
  q.style.cssText='font-size:1rem;font-weight:700;margin-bottom:1rem;line-height:1.4';
  q.textContent=item.q;
  card.appendChild(q);

  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.8rem';

  const explain=document.createElement('div');
  explain.style.cssText='font-size:0.8rem;color:#AAA;font-style:italic;margin-bottom:0.6rem;display:none';
  explain.textContent=item.explain;

  const nextBtn=document.createElement('button');
  nextBtn.style.cssText=`background:${w.color};color:#fff;border:none;padding:0.65rem 1.5rem;font-size:0.85rem;font-weight:700;display:none`;
  nextBtn.textContent=idx<items.length-1?'Next →':'See results';
  nextBtn.onclick=()=>{S.exIdx++;render();};

  (item.options||[]).forEach(opt=>{
    const b=document.createElement('button');
    b.textContent=opt;
    b.style.cssText='background:#0C0B09;border:1px solid #2A2825;color:#EDE8DF;padding:0.65rem 0.4rem;font-size:0.78rem;text-align:left';
    b.onclick=()=>{
      grid.querySelectorAll('button').forEach(x=>x.disabled=true);
      if(opt===item.answer){b.style.background='#0A1F10';b.style.borderColor='#4A9D6F';b.style.color='#4A9D6F';S.quizScore++;}
      else{b.style.background='#1F0A0A';b.style.borderColor='#C0392B';b.style.color='#C0392B';
        grid.querySelectorAll('button').forEach(x=>{if(x.textContent===item.answer){x.style.background='#0A1F10';x.style.borderColor='#4A9D6F';x.style.color='#4A9D6F';}});}
      explain.style.display='block';nextBtn.style.display='inline-block';
    };
    grid.appendChild(b);
  });

  card.appendChild(grid);card.appendChild(explain);card.appendChild(nextBtn);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

// CONVERSATION
function renderConvo(w) {
  const data=S.exercise;
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:0 1.2rem 2rem';

  const scenario=document.createElement('div');
  scenario.style.cssText='background:#111009;border:1px solid #1E1C18;padding:0.9rem;margin-bottom:0.8rem;font-size:0.85rem;line-height:1.5';
  scenario.innerHTML=`<strong>📍 ${data.scenario}</strong>`;
  if(data.tips&&data.tips.length){
    const tips=document.createElement('div');
    tips.style.cssText='display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.6rem';
    data.tips.forEach(t=>{
      const sp=document.createElement('span');
      sp.textContent='🔊 '+t;
      sp.style.cssText='font-size:0.72rem;padding:0.2rem 0.5rem;border:1px solid #2A2825;cursor:pointer;color:#AAA';
      sp.onclick=()=>speak(t);
      tips.appendChild(sp);
    });
    scenario.appendChild(tips);
  }
  wrap.appendChild(scenario);

  const chatBox=document.createElement('div');
  chatBox.style.cssText='height:270px;overflow-y:auto;background:#080706;border:1px solid #1E1C18;padding:0.9rem;display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.7rem';

  function renderMsgs(){
    chatBox.innerHTML='';
    S.chatHistory.forEach(m=>{
      const isUser=m.role==='user';
      const sp=m.text.includes('[Feedback:')?m.text.split('[Feedback:')[0].trim():m.text;
      const fp=m.text.includes('[Feedback:')?'[Feedback:'+m.text.split('[Feedback:')[1]:'';
      const bub=document.createElement('div');
      bub.style.cssText=`max-width:82%;padding:0.6rem 0.8rem;font-size:0.85rem;line-height:1.55;align-self:${isUser?'flex-end':'flex-start'};background:${isUser?w.color:'#111009'};border:${isUser?'none':'1px solid #1E1C18'};color:#EDE8DF;word-break:break-word`;
      bub.textContent=sp;
      if(fp){const fd=document.createElement('div');fd.style.cssText='font-size:0.75rem;color:#888;font-style:italic;margin-top:0.3rem';fd.textContent=fp;bub.appendChild(fd);}
      if(!isUser){const rb=document.createElement('button');rb.textContent='🔊';rb.style.cssText='background:none;border:none;color:rgba(255,255,255,0.4);font-size:0.8rem;float:right;cursor:pointer';rb.onclick=()=>speak(sp);bub.insertBefore(rb,bub.firstChild);}
      chatBox.appendChild(bub);
    });
    chatBox.scrollTop=chatBox.scrollHeight;
  }
  renderMsgs();
  wrap.appendChild(chatBox);

  async function send(text){
    if(!text.trim())return;
    S.chatHistory.push({role:'user',text});
    renderMsgs();
    const typing=document.createElement('div');
    typing.style.cssText='color:#555;letter-spacing:4px;align-self:flex-start;padding:0.5rem';
    typing.textContent='● ● ●';chatBox.appendChild(typing);chatBox.scrollTop=chatBox.scrollHeight;
    try{
      const msgs=S.chatHistory.map(m=>({role:m.role,content:m.text}));
      const reply=await ai(`You are a native Spanish speaker. Scenario: ${data.scenario}. Speak ONLY Spanish at A2 level. Max 2 sentences. After your reply add: [Feedback: one correction or compliment in English]`,msgs,300);
      S.chatHistory.push({role:'assistant',text:reply});
      speak(reply.split('[Feedback:')[0].trim());
    }catch(e){S.chatHistory.push({role:'assistant',text:'Lo siento, hubo un error.'});}
    renderMsgs();
  }

  // Toggle
  const toggleRow=document.createElement('div');
  toggleRow.style.cssText='display:flex;gap:0.5rem;margin-bottom:0.7rem';
  const tv=document.createElement('button');tv.textContent='🎙 Voice';tv.style.cssText=`flex:1;background:${w.color};border:1px solid ${w.color};color:#fff;padding:0.5rem;font-size:0.8rem`;
  const tt=document.createElement('button');tt.textContent='⌨️ Type';tt.style.cssText='flex:1;background:none;border:1px solid #2A2825;color:#AAA;padding:0.5rem;font-size:0.8rem';
  toggleRow.appendChild(tv);toggleRow.appendChild(tt);
  wrap.appendChild(toggleRow);

  const voicePanel=document.createElement('div');
  voicePanel.style.cssText='display:flex;flex-direction:column;align-items:center;gap:0.5rem;padding:0.8rem;background:#111009;border:1px solid #1E1C18';
  const mic=document.createElement('button');
  mic.textContent='🎙';mic.style.cssText=`width:56px;height:56px;border-radius:50%;border:2px solid ${w.color};background:transparent;font-size:1.4rem`;
  mic.onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Speech recognition needs Chrome.');return;}
    const rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=false;
    rec.onresult=e=>send(e.results[0][0].transcript);
    rec.start();mic.textContent='⏹';mic.style.background=w.color;
    rec.onend=()=>{mic.textContent='🎙';mic.style.background='transparent';};
  };
  const micLabel=document.createElement('div');micLabel.style.cssText='font-size:0.75rem;color:#666';micLabel.textContent='Tap mic to speak in Spanish';
  voicePanel.appendChild(mic);voicePanel.appendChild(micLabel);

  const typePanel=document.createElement('div');
  typePanel.style.cssText='display:none;gap:0.5rem';
  const tinp=document.createElement('input');tinp.type='text';tinp.placeholder='Escribe en español…';
  tinp.style.cssText='flex:1;background:#111009;border:1px solid #2A2825;color:#EDE8DF;padding:0.65rem 0.8rem;font-size:0.9rem';
  tinp.onkeydown=e=>{if(e.key==='Enter'){send(tinp.value);tinp.value='';}};
  const sb=document.createElement('button');sb.textContent='→';sb.style.cssText=`background:${w.color};color:#fff;border:none;padding:0.65rem 1rem;font-size:1rem`;
  sb.onclick=()=>{send(tinp.value);tinp.value='';};
  typePanel.appendChild(tinp);typePanel.appendChild(sb);

  tv.onclick=()=>{voicePanel.style.display='flex';typePanel.style.display='none';tv.style.background=w.color;tv.style.color='#fff';tt.style.background='none';tt.style.color='#AAA';};
  tt.onclick=()=>{voicePanel.style.display='none';typePanel.style.display='flex';tt.style.background=w.color;tt.style.color='#fff';tv.style.background='none';tv.style.color='#AAA';};

  wrap.appendChild(voicePanel);wrap.appendChild(typePanel);
  app.appendChild(wrap);
}

render();
</script>
</body>
</html>
