async function claude(system, messages, maxTokens=800) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:maxTokens,
      system,
      messages: Array.isArray(messages) ? messages : [{role:"user",content:messages}],
    }),
  });
  const d = await res.json();
  return d.content?.[0]?.text || "";
}

// Voice selection — ranked preference list, picks best available
const VOICE_PREFS = [
  // Google neural (Chrome desktop — best free option)
  v => v.name === "Google español" && v.lang === "es-ES",
  v => v.name === "Google español de Estados Unidos" && v.lang === "es-US",
  v => v.name.includes("Google") && v.lang.startsWith("es"),
  // Apple neural (Safari / iOS / macOS)
  v => v.name === "Mónica" && v.lang === "es-ES",
  v => v.name === "Paulina" && v.lang === "es-MX",
  v => v.name.includes("Monica") && v.lang.startsWith("es"),
  v => v.name.includes("Paulina") && v.lang.startsWith("es"),
  // Microsoft neural (Edge / Windows)
  v => v.name.includes("Elvira") && v.lang.startsWith("es"),
  v => v.name.includes("Alvaro") && v.lang.startsWith("es"),
  v => v.name.includes("Microsoft") && v.lang === "es-ES",
  v => v.name.includes("Microsoft") && v.lang.startsWith("es"),
  // Any es-ES
  v => v.lang === "es-ES",
  // Any Spanish
  v => v.lang.startsWith("es"),
];

let _cachedVoice = null;
let _voicesLoaded = false;

function getBestSpanishVoice() {
  if (_cachedVoice) return _cachedVoice;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  for (const test of VOICE_PREFS) {
    const match = voices.find(test);
    if (match) { _cachedVoice = match; return match; }
  }
  return null;
}

// Pre-load voices as soon as possible
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    _cachedVoice = null; // reset cache so next speak() re-evaluates
    getBestSpanishVoice();
    _voicesLoaded = true;
  };
}

function speak(text, rate=0.88) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();

  const doSpeak = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES";
    u.rate = rate;
    u.pitch = 1.0;
    const voice = getBestSpanishVoice();
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  };

  // Voices may not be loaded yet on first call — small delay fallback
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    doSpeak();
  } else {
    setTimeout(doSpeak, 250);
  }
}

function useSpeechInput(onResult, onError) {
  const recRef = useRef(null);
  const [listening, setListening] = useState(false);
  const start = useCallback(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onError("Speech recognition needs Chrome browser."); return; }
    const rec = new SR();
    rec.lang="es-ES"; rec.continuous=false; rec.interimResults=false;
    rec.onresult = e => { onResult(e.results[0][0].transcript); setListening(false); };
    rec.onerror = e => { onError("Mic error: "+e.error); setListening(false); };
    rec.onend = () => setListening(false);
    recRef.current = rec; rec.start(); setListening(true);
  }, [onResult, onError]);
  const stop = useCallback(() => { recRef.current?.stop(); setListening(false); }, []);
  return { listening, start, stop };
}

function VoicePicker() {
  const [voices, setVoices] = useState([]);
  const [selected, setSelected] = useState(null);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    const load = () => {
      const all = window.speechSynthesis.getVoices();
      const esVoices = all.filter(v => v.lang.startsWith("es"));
      setVoices(esVoices);
      if (esVoices.length) {
        const best = getBestSpanishVoice();
        if (best && !selected) setSelected(best.name);
      }
    };
    load();
    window.speechSynthesis.onvoiceschanged = load;
  }, []);

  const choose = (v) => {
    _cachedVoice = v;
    setSelected(v.name);
    setOpen(false);
    speak("Hola, soy tu profesora de español. ¿Cómo estás?", 0.88);
  };

  if (!voices.length) return (
    <div style={{fontSize:"0.72rem",color:"#555",marginBottom:"1rem"}}>
      🔊 Open in Chrome for best Spanish voices
    </div>
  );

  return (
    <div style={{marginBottom:"1.2rem",position:"relative"}}>
      <div style={{fontSize:"0.6rem",color:"#555",textTransform:"uppercase",letterSpacing:"0.15em",marginBottom:"0.3rem"}}>Voice</div>
      <button onClick={()=>setOpen(o=>!o)}
        style={{background:"#111009",border:"1px solid #2A2825",color:"#AAA",padding:"0.45rem 0.8rem",
          cursor:"pointer",fontFamily:"inherit",fontSize:"0.75rem",display:"flex",alignItems:"center",gap:"0.5rem",width:"100%",justifyContent:"space-between"}}>
        <span>🔊 {selected||"Select voice…"}</span>
        <span>{open?"▲":"▼"}</span>
      </button>
      {open && (
        <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#111009",border:"1px solid #2A2825",
          zIndex:100,maxHeight:180,overflowY:"auto"}}>
          {voices.map(v=>(
            <div key={v.name} onClick={()=>choose(v)}
              style={{padding:"0.5rem 0.8rem",cursor:"pointer",fontSize:"0.78rem",
                background:selected===v.name?"#1E1C18":"transparent",
                color:selected===v.name?"#EDE8DF":"#888",
                borderBottom:"1px solid #1A1816",display:"flex",justifyContent:"space-between"}}>
              <span>
                <span style={{color:"#C0392B",marginRight:6,fontSize:"0.65rem"}}>
                  {v.name.includes("Google")?"[G]":v.name.includes("Microsoft")?"[M]":"[◆]"}
                </span>
                {v.name}
              </span>
              <span style={{color:"#555",fontSize:"0.65rem"}}>{v.lang}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Map ───────────────────────────────────────────────────────────────────────

    <div>
      <header style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.9rem 1.5rem",borderBottom:"1px solid #1A1816",position:"sticky",top:0,background:"#0C0B09",zIndex:10}}>

        <span style={{color:"#D35400",fontSize:"0.85rem",fontWeight:700}}>⚡ {xp} XP</span>
      </header>
      <div style={{display:"flex",borderBottom:"1px solid #1A1816"}}>
        {weeks.map((wk,i)=>(
          <button key={wk.week} onClick={()=>setActiveWeek(i)}
            style={{flex:1,background:"none",border:"none",borderBottom:i===activeWeek?`3px solid ${wk.color}`:"3px solid transparent",
              color:i===activeWeek?wk.color:"#555",padding:"0.7rem 0.3rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.8rem",fontWeight:i===activeWeek?700:400}}>
            W{wk.week}

        ))}

      <div style={{padding:"1rem 1.5rem",display:"flex",alignItems:"center",gap:"0.8rem",background:w.color+"22"}}>
        <span style={{fontSize:"0.65rem",color:w.color,textTransform:"uppercase",letterSpacing:"0.2em"}}>Week {w.week}</span>
        <span style={{fontWeight:700,fontSize:"1rem",fontStyle:"italic"}}>{w.title}</span>
      </div>
      <div style={{padding:"0.5rem 1.2rem 2rem"}}>
        {w.lessons.map((l,i)=>{
          const isDone = !!progress[l.id];
          const prevDone = i === 0 ? true : !!progress[w.lessons[i-1].id];
          const locked = !isDone && !prevDone;
          return (
            <div key={l.id} onClick={()=>{ if(!locked) onLesson(l); }}
              style={{display:"flex",alignItems:"center",padding:"1rem 0.9rem",margin:"0.5rem 0",
                background:"#111009",borderLeft:`4px solid ${locked?"#333":w.color}`,cursor:locked?"default":"pointer",
                gap:"0.8rem",opacity:locked?0.3:1,userSelect:"none"}}>
              <span style={{fontSize:"0.6rem",color:"#666",textTransform:"uppercase",letterSpacing:"0.1em",minWidth:36,flexShrink:0}}>D{l.day}</span>

              </div>

            </div>
          );
        })}
      </div>
    </div>
  );
}

          <div style={{fontSize:"0.65rem",textTransform:"uppercase",letterSpacing:"0.2em",color:"#666",marginBottom:"0.8rem"}}>Choose practice mode</div>
          {[
            {id:"drill",icon:"⚡",label:"Grammar Drills",desc:"Fill-blanks + voice answer"},
            {id:"pronunciation",icon:"🔊",label:"Pronunciation Lab",desc:"Hear + repeat + get scored"},
            {id:"conversation",icon:"🗣",label:"Voice Conversation",desc:"Full spoken AI dialogue"},

      )}
      {mode==="drill"         && <DrillMode lesson={lesson} week={week} onBack={()=>setMode(null)}/>}
      {mode==="pronunciation" && <PronunciationMode lesson={lesson} week={week} onBack={()=>setMode(null)}/>}
      {mode==="conversation"  && <ConversationMode lesson={lesson} week={week} onBack={()=>setMode(null)}/>}
      {mode==="quiz"          && <QuizMode lesson={lesson} week={week} onBack={()=>setMode(null)}/>}
    </div>
  );
}

// ── Drill Mode ────────────────────────────────────────────────────────────────
function DrillMode({ lesson, week, onBack }) {
  const [content,setContent]=useState(null);
  const [idx,setIdx]=useState(0);
  const [voiceAnswer,setVoiceAnswer]=useState("");
  const [textAnswer,setTextAnswer]=useState("");
  const [feedback,setFeedback]=useState(null);
  const [checking,setChecking]=useState(false);
  const [loading,setLoading]=useState(true);
  const onSpeech=useCallback(t=>setVoiceAnswer(t),[]);
  const onErr=useCallback(()=>{},[]);
  const {listening,start,stop}=useSpeechInput(onSpeech,onErr);

  useEffect(()=>{
    (async()=>{
      const raw=await claude(
        "You are a DELE A2 Spanish teacher. Return ONLY valid JSON, no markdown fences.",
        `Create 5 fill-in-the-blank sentences for a low A2 Spanish learner. Topic:"${lesson.title}". Grammar:"${lesson.grammar}".
JSON: {"sentences":[{"es":"sentence with ___ blank","answer":"correct word","hint":"English grammar tip","example":"full correct sentence"}]}`
      );
      try{setContent(JSON.parse(raw.replace(/```json|```/g,"").trim()));}
      catch{setContent({sentences:[{es:"Error loading ___.",answer:"retry",hint:"Go back and try again",example:""}]});}
      setLoading(false);
    })();
  },[lesson]);

  const sentence=content?.sentences?.[idx];
  const answer=voiceAnswer||textAnswer;

  const check=async()=>{
    if(!answer.trim()||!sentence)return;
    setChecking(true);
    const fb=await claude(
      "You are a kind DELE A2 Spanish teacher. 2 sentences max. Start ✅ if correct or ❌ if wrong.",
      `Student filled blank in "${sentence.es}" with:"${answer}". Correct:"${sentence.answer}". Give feedback.`
    );
    setFeedback(fb);
    if(sentence.example) speak(sentence.example);
    setChecking(false);
  };

  const next=()=>{setIdx(i=>i+1);setVoiceAnswer("");setTextAnswer("");setFeedback(null);};

  if(loading)return <Loading/>;
  if(!sentence)return <div style={{padding:"1.2rem 1.5rem"}}><ModeHeader label="⚡ Grammar Drills" onBack={onBack}/><div style={{padding:"1.5rem",textAlign:"center",color:"#4A9D6F",border:"1px solid #4A9D6F",marginTop:"1rem"}}>🎉 All drills done!</div></div>;

  const parts=sentence.es.split("___");
  return (
    <div style={{padding:"0 1.2rem 2rem"}}>
      <ModeHeader label="⚡ Grammar Drills" onBack={onBack}/>
      <div style={{color:"#666",fontSize:"0.72rem",textAlign:"right",marginBottom:"0.4rem"}}>{idx+1} / {content.sentences.length}</div>
      <div style={{background:"#111009",border:"1px solid #1E1C18",padding:"1.2rem",marginBottom:"1rem"}}>
        <div style={{fontSize:"0.78rem",color:"#888",fontStyle:"italic",marginBottom:"0.8rem"}}>💡 {sentence.hint}</div>
        <div style={{fontSize:"1.05rem",lineHeight:2.2}}>
          <span>{parts[0]}</span>
          <span style={{borderBottom:`2px solid ${week.color}`,minWidth:60,display:"inline-block",textAlign:"center",color:week.color,margin:"0 4px"}}>{answer||"___"}</span>
          <span>{parts[1]}</span>
        </div>
        {sentence.example&&<button onClick={()=>speak(sentence.example)} style={{background:"none",border:"none",color:"#888",cursor:"pointer",fontSize:"0.78rem",marginTop:"0.5rem",fontFamily:"inherit"}}>🔊 Hear full sentence</button>}
      </div>
      <div style={{marginBottom:"0.8rem"}}>
        <div style={{display:"flex",gap:"0.6rem",alignItems:"center"}}>
          <input value={textAnswer} onChange={e=>setTextAnswer(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&check()}
            placeholder="Type your answer…"
            style={{flex:1,background:"#111009",border:"1px solid #2A2825",color:"#EDE8DF",padding:"0.65rem 0.8rem",fontFamily:"inherit",fontSize:"0.9rem",outline:"none"}}/>
          <MicBtn listening={listening} onStart={start} onStop={stop} color={week.color} size={42}/>
        </div>
        {listening&&<div style={{display:"flex",alignItems:"center",gap:"0.4rem",fontSize:"0.78rem",color:week.color,marginTop:"0.4rem"}}><Waveform active color={week.color}/> Listening in Spanish…</div>}
        {voiceAnswer&&<div style={{fontSize:"0.82rem",color:"#AAA",fontStyle:"italic",marginTop:"0.4rem"}}>🎙 You said: <em>"{voiceAnswer}"</em></div>}
      </div>
      <button onClick={check} disabled={!answer.trim()||checking}
        style={{width:"100%",border:"none",color:"#fff",padding:"0.75rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.9rem",fontWeight:700,background:week.color,opacity:(!answer.trim()||checking)?0.6:1}}>
        {checking?"Checking…":"Check Answer"}
      </button>
      {feedback&&(
        <div style={{margin:"0.8rem 0",padding:"0.9rem",background:"#111009",border:"1px solid #1E1C18",fontSize:"0.85rem",lineHeight:1.6}}>
          {feedback}
          <div style={{marginTop:"0.5rem",fontSize:"0.82rem",color:"#888"}}>Correct: <strong>{sentence.answer}</strong> <SpeakBtn text={sentence.example||sentence.answer}/></div>
        </div>
      )}
      {feedback&&idx<content.sentences.length-1&&(
        <button onClick={next} style={{display:"block",width:"100%",marginTop:"0.8rem",background:"#1E1C18",border:"1px solid #2A2825",color:"#EDE8DF",padding:"0.65rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.85rem"}}>Next →</button>
      )}
    </div>
  );
}

// ── Pronunciation Mode ────────────────────────────────────────────────────────
function PronunciationMode({ lesson, week, onBack }) {
  const [phrases,setPhrases]=useState(null);
  const [idx,setIdx]=useState(0);
  const [spoken,setSpoken]=useState("");
  const [score,setScore]=useState(null);
  const [scoring,setScoring]=useState(false);
  const [loading,setLoading]=useState(true);
  const onSpeech=useCallback(t=>setSpoken(t),[]);
  const onErr=useCallback(()=>{},[]);
  const {listening,start,stop}=useSpeechInput(onSpeech,onErr);

  useEffect(()=>{
    (async()=>{
      const raw=await claude(
        "Return ONLY valid JSON, no markdown.",
        `Generate 6 Spanish phrases for a low A2 learner to practise pronunciation. Topic:"${lesson.title}".
JSON: {"phrases":[{"es":"phrase","en":"English meaning","tip":"pronunciation tip","sounds":"key sounds"}]}`
      );
      try{setPhrases(JSON.parse(raw.replace(/```json|```/g,"").trim()));}
      catch{setPhrases({phrases:[{es:"Buenos días",en:"Good morning",tip:"Roll the r gently",sounds:"ue diphthong"}]});}
      setLoading(false);
    })();
  },[lesson]);

  const p=phrases?.phrases?.[idx];
  const scoreIt=async()=>{
    if(!spoken||!p)return;
    setScoring(true);
    const fb=await claude(
      "You are a Spanish pronunciation coach. Be encouraging but precise. Reply in 3 sentences max.",
      `Student tried to say:"${p.es}" (${p.en}). Speech recognition got:"${spoken}". Score out of 10, identify issues, give one tip. Format: "Score: X/10. [Issue]. [Tip]."`
    );
    setScore(fb);
    setScoring(false);
  };
  const next=()=>{setIdx(i=>i+1);setSpoken("");setScore(null);};

  if(loading)return <Loading/>;
  if(!p)return <div style={{padding:"1.2rem 1.5rem"}}><ModeHeader label="🔊 Pronunciation Lab" onBack={onBack}/><div style={{padding:"1.5rem",textAlign:"center",color:"#4A9D6F",border:"1px solid #4A9D6F",marginTop:"1rem"}}>🎉 All phrases done!</div></div>;

  return (
    <div style={{padding:"0 1.2rem 2rem"}}>
      <ModeHeader label="🔊 Pronunciation Lab" onBack={onBack}/>
      <div style={{color:"#666",fontSize:"0.72rem",textAlign:"right",marginBottom:"0.4rem"}}>{idx+1} / {phrases.phrases.length}</div>
      <div style={{background:"#111009",border:"1px solid #1E1C18",padding:"1.4rem",marginBottom:"1rem"}}>
        <div style={{fontSize:"1.5rem",fontWeight:700,fontStyle:"italic",marginBottom:"0.3rem"}}>{p.es}</div>
        <div style={{color:"#888",fontSize:"0.85rem",marginBottom:"0.5rem"}}>{p.en}</div>
        <div style={{fontSize:"0.78rem",color:"#D35400",marginBottom:"0.4rem"}}>Focus: <em>{p.sounds}</em></div>
        <div style={{fontSize:"0.8rem",color:"#AAA",fontStyle:"italic",marginBottom:"0.8rem"}}>💡 {p.tip}</div>
        <button onClick={()=>speak(p.es,"es-ES",0.75)}
          style={{background:week.color,border:"none",color:"#fff",padding:"0.6rem 1.2rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.9rem",marginRight:"0.5rem",marginBottom:"0.4rem"}}>
          🔊 Slow
        </button>
        <button onClick={()=>speak(p.es,"es-ES",0.95)}
          style={{background:"none",border:"1px solid #2A2825",color:"#AAA",padding:"0.6rem 1.2rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.9rem"}}>
          🔊 Normal
        </button>
      </div>
      <div style={{background:"#111009",border:"1px solid #1E1C18",padding:"1.2rem",marginBottom:"1rem"}}>
        <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:"0.15em",color:"#666",marginBottom:"0.8rem"}}>Now you try:</div>
        <div style={{display:"flex",alignItems:"center",gap:"1rem"}}>
          <MicBtn listening={listening} onStart={()=>{setSpoken("");setScore(null);start();}} onStop={stop} size={64} color={week.color}/>
          <Waveform active={listening} color={week.color}/>
        </div>
        {listening&&<div style={{display:"flex",alignItems:"center",gap:"0.4rem",fontSize:"0.78rem",color:week.color,marginTop:"0.6rem"}}>Listening…</div>}
        {spoken&&<div style={{fontSize:"0.82rem",color:"#AAA",fontStyle:"italic",marginTop:"0.4rem"}}>🎙 Detected: <em>"{spoken}"</em></div>}
      </div>
      {spoken&&!score&&(
        <button onClick={scoreIt} disabled={scoring}
          style={{width:"100%",border:"none",color:"#fff",padding:"0.75rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.9rem",fontWeight:700,background:week.color}}>
          {scoring?"Analysing…":"Score my pronunciation"}
        </button>
      )}
      {score&&(
        <div style={{margin:"0.8rem 0",padding:"0.9rem",background:"#111009",border:"1px solid #1E1C18",fontSize:"0.85rem",lineHeight:1.6}}>
          {score}
          {idx<phrases.phrases.length-1&&<button onClick={next}
            style={{display:"block",width:"100%",marginTop:"0.8rem",background:"#1E1C18",border:"1px solid #2A2825",color:"#EDE8DF",padding:"0.65rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.85rem"}}>
            Next phrase →
          </button>}
        </div>
      )}
    </div>
  );
}

// ── Conversation Mode ─────────────────────────────────────────────────────────
function ConversationMode({ lesson, week, onBack }) {
  const [scenario,setScenario]=useState(null);
  const [history,setHistory]=useState([]);
  const [textInput,setTextInput]=useState("");
  const [aiTyping,setAiTyping]=useState(false);
  const [loading,setLoading]=useState(true);
  const [voiceMode,setVoiceMode]=useState(true);
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[history,aiTyping]);

  useEffect(()=>{
    (async()=>{
      const raw=await claude(
        "Return ONLY valid JSON, no markdown.",
        `Create a realistic A2 Spanish conversation scenario. Topic:"${lesson.title}".
JSON: {"scenario":"1-sentence situation in English","opener":"first Spanish line from AI partner (A2 level)","vocab":["key phrase 1","key phrase 2","key phrase 3"]}`
      );
      try{
        const sc=JSON.parse(raw.replace(/```json|```/g,"").trim());
        setScenario(sc);
        setHistory([{role:"assistant",text:sc.opener}]);
        speak(sc.opener);
      }catch{
        setScenario({scenario:"Everyday conversation",opener:"Hola, ¿cómo estás hoy?",vocab:[]});
        setHistory([{role:"assistant",text:"Hola, ¿cómo estás hoy?"}]);
      }
      setLoading(false);
    })();
  },[lesson]);

  const sendMessage=async(text)=>{
    if(!text.trim())return;
    const newH=[...history,{role:"user",text}];
    setHistory(newH);setTextInput("");setAiTyping(true);
    const convMsgs=newH.map(m=>({role:m.role,content:m.text}));
    const sys=`You are a native Spanish speaker. Scenario: ${scenario?.scenario||"everyday chat"}.
Speak ONLY Spanish at A2 level. Max 2 sentences. After your reply add: [Feedback: one correction or compliment in English]`;
    const reply=await claude(sys,convMsgs,400);
    setHistory([...newH,{role:"assistant",text:reply}]);
    speak(reply.split("[Feedback:")[0].trim());
    setAiTyping(false);
  };

  if(loading)return <Loading/>;

  return (
    <div style={{padding:"0 1.2rem 2rem"}}>
      <ModeHeader label="🗣 Voice Conversation" onBack={onBack}/>
      {scenario&&(
        <div style={{background:"#111009",border:"1px solid #1E1C18",padding:"0.9rem",marginBottom:"0.8rem",fontSize:"0.85rem",lineHeight:1.5}}>
          <strong>📍 {scenario.scenario}</strong>
          {scenario.vocab?.length>0&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:"0.4rem",marginTop:"0.6rem"}}>
              {scenario.vocab.map(v=>(
                <span key={v} onClick={()=>speak(v)}
                  style={{fontSize:"0.72rem",padding:"0.2rem 0.5rem",border:"1px solid #2A2825",cursor:"pointer",color:"#AAA"}}>🔊 {v}</span>
              ))}
            </div>
          )}
        </div>
      )}
      <div style={{height:280,overflowY:"auto",background:"#080706",border:"1px solid #1E1C18",padding:"0.9rem",marginBottom:"0.7rem",display:"flex",flexDirection:"column",gap:"0.5rem"}}>
        {history.map((m,i)=>(
          <div key={i} style={{maxWidth:"82%",padding:"0.6rem 0.8rem",fontSize:"0.85rem",lineHeight:1.55,
            alignSelf:m.role==="user"?"flex-end":"flex-start",
            background:m.role==="user"?week.color:"#111009",
            border:m.role==="user"?"none":"1px solid #1E1C18",
            color:m.role==="user"?"#fff":"#EDE8DF",position:"relative"}}>
            {m.role==="assistant"&&(
              <button onClick={()=>speak(m.text.split("[Feedback:")[0].trim())}
                style={{position:"absolute",top:4,right:4,background:"none",border:"none",cursor:"pointer",fontSize:"0.8rem",opacity:0.5}}>🔊</button>
            )}
            {m.text.includes("[Feedback:")?(
              <>
                <div>{m.text.split("[Feedback:")[0].trim()}</div>
                <div style={{fontSize:"0.75rem",color:m.role==="user"?"rgba(255,255,255,0.7)":"#888",fontStyle:"italic",marginTop:"0.3rem"}}>[{m.text.split("[Feedback:")[1]}</div>
              </>
            ):m.text}
          </div>
        ))}
        {aiTyping&&<div style={{alignSelf:"flex-start",background:"#111009",border:"1px solid #1E1C18",padding:"0.6rem 0.8rem",color:"#555",letterSpacing:4}}>● ● ●</div>}
        <div ref={endRef}/>
      </div>
      <div style={{display:"flex",gap:"0.5rem",marginBottom:"0.7rem"}}>
        <button onClick={()=>setVoiceMode(true)}
          style={{flex:1,background:voiceMode?week.color:"none",border:`1px solid ${voiceMode?week.color:"#2A2825"}`,color:voiceMode?"#fff":"#AAA",padding:"0.5rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.8rem"}}>
          🎙 Voice
        </button>
        <button onClick={()=>setVoiceMode(false)}
          style={{flex:1,background:!voiceMode?week.color:"none",border:`1px solid ${!voiceMode?week.color:"#2A2825"}`,color:!voiceMode?"#fff":"#AAA",padding:"0.5rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.8rem"}}>
          ⌨️ Type
        </button>
      </div>
      {voiceMode?(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"0.6rem",padding:"1rem",background:"#111009",border:"1px solid #1E1C18"}}>
          <MicBtn listening={false} onStart={()=>{
            const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
            if(!SR){alert("Speech recognition needs Chrome.");return;}
            const rec=new SR();rec.lang="es-ES";rec.continuous=false;rec.interimResults=false;
            rec.onresult=e=>{sendMessage(e.results[0][0].transcript);};
            rec.start();
          }} onStop={()=>{}} size={56} color={week.color}/>
          <div style={{fontSize:"0.75rem",color:"#666"}}>Tap to speak in Spanish</div>
        </div>
      ):(
        <div style={{display:"flex",gap:"0.5rem"}}>
          <input value={textInput} onChange={e=>setTextInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&sendMessage(textInput)}
            placeholder="Escribe en español…"
            style={{flex:1,background:"#111009",border:"1px solid #2A2825",color:"#EDE8DF",padding:"0.65rem 0.8rem",fontFamily:"inherit",fontSize:"0.9rem",outline:"none"}}/>
          <button onClick={()=>sendMessage(textInput)} disabled={aiTyping}
            style={{background:week.color,border:"none",color:"#fff",padding:"0.65rem 1rem",cursor:"pointer",fontFamily:"inherit",fontSize:"1rem"}}>→</button>
        </div>
      )}
    </div>
  );
}

// ── Quiz Mode ─────────────────────────────────────────────────────────────────
function QuizMode({ lesson, week, onBack }) {
  const [questions,setQuestions]=useState(null);
  const [idx,setIdx]=useState(0);
  const [selected,setSelected]=useState(null);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    (async()=>{
      const raw=await claude(
        "Return ONLY valid JSON, no markdown.",
        `Create 5 DELE A2 exam-style multiple choice questions. Topic:"${lesson.title}", Grammar:"${lesson.grammar}". Low A2 level.
JSON: {"questions":[{"q":"question","options":["A: ...","B: ...","C: ...","D: ..."],"answer":"A: ... full text","explain":"brief explanation","audio":"short Spanish phrase to read aloud"}]}`
      );
      try{setQuestions(JSON.parse(raw.replace(/```json|```/g,"").trim()));}
      catch{setQuestions({questions:[{q:"Error loading quiz.",options:["A: Retry"],answer:"A: Retry",explain:"",audio:""}]});}
      setLoading(false);
    })();
  },[lesson]);

  const q=questions?.questions?.[idx];
  const choose=(opt)=>{
    if(selected)return;
    setSelected(opt);
    if(opt===q.answer)setScore(s=>s+1);
    if(q.audio)speak(q.audio);
  };
  const next=()=>{
    if(idx<questions.questions.length-1){setIdx(i=>i+1);setSelected(null);}
    else setDone(true);
  };

  if(loading)return <Loading/>;
  if(done)return (
    <div style={{padding:"0 1.2rem 2rem"}}>
      <ModeHeader label="🎯 DELE Quiz" onBack={onBack}/>
      <div style={{textAlign:"center",padding:"2.5rem 1rem"}}>
        <div style={{fontSize:"3.5rem",fontWeight:700,marginBottom:"0.5rem",color:week.color}}>{score}/{questions.questions.length}</div>
        <div style={{color:"#888",marginBottom:"1.5rem",fontSize:"0.9rem"}}>
          {score===questions.questions.length?"¡Perfecto! Excelente trabajo.":score>=3?"¡Bien! Keep drilling the gaps.":"Sigue practicando — you'll get there."}
        </div>
        <button onClick={()=>{setIdx(0);setSelected(null);setScore(0);setDone(false);}}
          style={{background:week.color,border:"none",color:"#fff",padding:"0.75rem 2rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.9rem",fontWeight:700}}>
          Retry Quiz
        </button>
      </div>
    </div>
  );
  if(!q)return null;

  return (
    <div style={{padding:"0 1.2rem 2rem"}}>
      <ModeHeader label="🎯 DELE Quiz" onBack={onBack}/>
      <div style={{color:"#666",fontSize:"0.72rem",textAlign:"right",marginBottom:"0.4rem"}}>{idx+1} / {questions.questions.length}</div>
      <div style={{background:"#111009",border:"1px solid #1E1C18",padding:"1.2rem"}}>
        <div style={{fontSize:"1rem",fontWeight:700,marginBottom:"1rem",lineHeight:1.4}}>
          {q.q} {q.audio&&<SpeakBtn text={q.audio}/>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.5rem",marginBottom:"0.8rem"}}>
          {q.options.map(opt=>(
            <button key={opt} onClick={()=>choose(opt)}
              style={{background:selected===opt&&opt===q.answer?"#0A1F10":selected===opt&&opt!==q.answer?"#1F0A0A":selected&&opt===q.answer?"#0A1F10":"#0C0B09",
                border:`1px solid ${selected===opt&&opt===q.answer?"#4A9D6F":selected===opt&&opt!==q.answer?"#C0392B":selected&&opt===q.answer?"#4A9D6F":"#2A2825"}`,
                color:selected===opt&&opt===q.answer?"#4A9D6F":selected===opt&&opt!==q.answer?"#C0392B":selected&&opt===q.answer?"#4A9D6F":"#EDE8DF",
                padding:"0.65rem 0.4rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.78rem",textAlign:"left"}}>
              {opt}
            </button>
          ))}
        </div>
        {selected&&<div style={{fontSize:"0.8rem",color:"#AAA",fontStyle:"italic",marginBottom:"0.6rem"}}>{q.explain}</div>}
        {selected&&<button onClick={next}
          style={{background:week.color,border:"none",color:"#fff",padding:"0.65rem 1.5rem",cursor:"pointer",fontFamily:"inherit",fontSize:"0.85rem",fontWeight:700}}>
          {idx<questions.questions.length-1?"Next →":"See results"}
        </button>}
      </div>
    </div>
  );
}

// ── App Root ──────────────────────────────────────────────────────────────────
function App() {
  const [screen,setScreen]=useState("home");
  const [activeWeek,setActiveWeek]=useState(0);
  const [lesson,setLesson]=useState(null);
  const [mode,setMode]=useState(null);
  const [progress,setProgress]=useState(()=>{try{return JSON.parse(localStorage.getItem("a2v_prog")||"{}");}catch{return{};}});
  const [xp,setXp]=useState(()=>+localStorage.getItem("a2v_xp")||0);

  const markDone=id=>{
    const p={...progress,[id]:true};
    setProgress(p);localStorage.setItem("a2v_prog",JSON.stringify(p));
    const nx=xp+60;setXp(nx);localStorage.setItem("a2v_xp",nx);
  };

  const total=WEEKS.reduce((a,w)=>a+w.lessons.length,0);
  const done=Object.keys(progress).length;
  const pct=Math.round(done/total*100);

  if(screen==="home")return <Home pct={pct} done={done} total={total} xp={xp} onStart={()=>setScreen("map")}/>;
  if(screen==="map")return <Map weeks={WEEKS} progress={progress} activeWeek={activeWeek} setActiveWeek={setActiveWeek}
    onBack={()=>setScreen("home")} xp={xp} onLesson={l=>{setLesson(l);setMode(null);setScreen("lesson");}}/>;
  if(screen==="lesson"&&lesson)return <LessonScreen lesson={lesson} weeks={WEEKS} progress={progress}
    onBack={()=>setScreen("map")} onDone={()=>{markDone(lesson.id);setScreen("map");}}
    mode={mode} setMode={setMode} xp={xp}/>;
  return null;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
